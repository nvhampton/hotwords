<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Totwords</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#222222">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; overscroll-behavior: none;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #app { position: fixed; inset: 0; }

  #start {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center;
    background: #1e1b4b; color: white; gap: 16px; text-align: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    overflow-y: auto;
  }
  #start h1 { font-size: clamp(1.8rem, 7vw, 3rem); margin: 12px 0 0; }
  #start p { font-size: clamp(0.9rem, 2.6vw, 1.1rem); opacity: 0.75; margin: 0; max-width: 32ch; }

  #pack-list {
    display: flex; flex-direction: column; gap: 12px;
    width: 100%; max-width: 440px; margin: 8px 0 16px;
  }
  .pack-btn {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px; border-radius: 20px; border: none;
    cursor: pointer; text-align: left; color: #1f2937;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  }
  .pack-btn .pack-emoji { font-size: 2rem; line-height: 1; }
  .pack-btn .pack-text { flex: 1; }
  .pack-btn .pack-name { font-weight: 800; font-size: 1.05rem; display: block; }
  .pack-btn .pack-meta { font-weight: 600; font-size: 0.78rem; opacity: 0.6; display: block; margin-top: 2px; }
  .pack-btn .pack-count { font-weight: 700; font-size: 0.85rem; opacity: 0.55; }

  #deck {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    transition: background-color 0.25s ease;
  }
  #deck.active { display: flex; }

  #card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4vh; }
  #emoji {
    font-size: clamp(6rem, 42vmin, 18rem); line-height: 1;
    filter: drop-shadow(0 8px 20px rgba(0,0,0,0.15));
  }
  #word {
    font-size: clamp(2.2rem, 11vw, 5.5rem); font-weight: 800;
    color: #1f2937; letter-spacing: 0.02em; text-transform: capitalize;
  }

  .zone { position: absolute; top: 0; bottom: 0; width: 22%; z-index: 2; }
  #zone-prev { left: 0; }
  #zone-next { right: 0; }
  .arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    font-size: clamp(1.5rem, 4vw, 2.5rem); color: rgba(0,0,0,0.25);
    pointer-events: none;
  }
  #zone-prev .arrow { left: 4vw; }
  #zone-next .arrow { right: 4vw; }

  #topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 3;
    display: flex; align-items: center; justify-content: space-between;
    padding: max(12px, env(safe-area-inset-top)) 16px 12px;
  }
  #counter {
    font-size: 1rem; font-weight: 700; color: rgba(0,0,0,0.4);
    background: rgba(255,255,255,0.6); padding: 4px 12px; border-radius: 999px;
  }
  .icon-btn {
    font-size: 1.3rem; background: rgba(255,255,255,0.6); border: none;
    border-radius: 999px; width: 44px; height: 44px; cursor: pointer;
  }

  #hint {
    position: absolute; bottom: max(20px, env(safe-area-inset-bottom));
    left: 0; right: 0; text-align: center; z-index: 3;
    font-size: 0.85rem; color: rgba(0,0,0,0.35); font-weight: 600;
  }
</style>
</head>
<body>
<div id="app">
  <div id="start">
    <h1>Totwords</h1>
    <p>Pick a pack, then tap words to hear them out loud. Tap the edges to move between cards.</p>
    <div id="pack-list"></div>
  </div>

  <div id="deck">
    <div id="topbar">
      <button id="packs-btn" class="icon-btn" title="Choose pack">🗂️</button>
      <span id="counter"></span>
      <button id="shuffle-btn" class="icon-btn" title="Shuffle">🔀</button>
    </div>
    <div id="zone-prev" class="zone"><span class="arrow">‹</span></div>
    <div id="zone-next" class="zone"><span class="arrow">›</span></div>
    <div id="card">
      <div id="emoji"></div>
      <div id="word"></div>
    </div>
    <div id="hint">tap card to hear it again</div>
  </div>
</div>

<script>
(function () {
  const PACKS = [
    {
      name: "Pack 1: First Words", icon: "🐶", color: "#fde68a", difficulty: "Easy",
      words: [
        ["Apple", "🍎"], ["Ball", "⚽"], ["Banana", "🍌"], ["Bear", "🐻"], ["Bird", "🐦"],
        ["Book", "📖"], ["Bus", "🚌"], ["Car", "🚗"], ["Cat", "🐱"], ["Chicken", "🐔"],
        ["Cookie", "🍪"], ["Cow", "🐮"], ["Dog", "🐶"], ["Duck", "🦆"], ["Elephant", "🐘"],
        ["Fish", "🐟"], ["Flower", "🌸"], ["Hat", "🎩"], ["Horse", "🐴"], ["Lion", "🦁"],
        ["Milk", "🥛"], ["Moon", "🌙"], ["Pig", "🐷"], ["Shoe", "👟"], ["Sheep", "🐑"],
        ["Star", "⭐"], ["Sun", "☀️"], ["Tree", "🌳"], ["Water", "💧"], ["Cake", "🎂"],
        ["Egg", "🥚"], ["Frog", "🐸"], ["Bee", "🐝"], ["Butterfly", "🦋"], ["Rabbit", "🐰"],
        ["Monkey", "🐵"], ["Owl", "🦉"], ["Turtle", "🐢"], ["Bread", "🍞"], ["Cheese", "🧀"],
        ["Balloon", "🎈"], ["Train", "🚂"], ["Boat", "⛵"], ["Airplane", "✈️"], ["Bicycle", "🚲"],
        ["Chair", "🪑"], ["Spoon", "🥄"], ["Cup", "🥤"], ["Bed", "🛏️"], ["Door", "🚪"]
      ]
    },
    {
      name: "Pack 2: Around the House", icon: "🏠", color: "#bfdbfe", difficulty: "Easy",
      words: [
        ["Lamp", "💡"], ["TV", "📺"], ["Phone", "📱"], ["Clock", "⏰"], ["Window", "🪟"],
        ["Soap", "🧼"], ["Toothbrush", "🪥"], ["Bathtub", "🛁"], ["Mirror", "🪞"], ["Key", "🔑"],
        ["Broom", "🧹"], ["Backpack", "🎒"], ["Box", "📦"], ["Umbrella", "☂️"], ["Candle", "🕯️"],
        ["Gift", "🎁"], ["Bell", "🔔"], ["Scissors", "✂️"], ["Pencil", "✏️"], ["Crayon", "🖍️"],
        ["Guitar", "🎸"], ["Drum", "🥁"], ["Ring", "💍"], ["Glasses", "👓"], ["Sock", "🧦"],
        ["Shirt", "👕"], ["Pants", "👖"], ["Dress", "👗"], ["Jacket", "🧥"], ["Crown", "👑"],
        ["Bow", "🎀"], ["Basket", "🧺"], ["Bucket", "🪣"], ["Trash Can", "🗑️"], ["Plate", "🍽️"],
        ["Bowl", "🥣"], ["Fork", "🍴"], ["Pot", "🍳"], ["Kettle", "🫖"], ["Bottle", "🍼"],
        ["Teddy Bear", "🧸"], ["Blocks", "🧱"], ["Puzzle", "🧩"], ["Kite", "🪁"], ["Robot", "🤖"]
      ]
    },
    {
      name: "Pack 3: Wild Animals & Nature", icon: "🦁", color: "#a7f3d0", difficulty: "Easy",
      words: [
        ["Tiger", "🐯"], ["Zebra", "🦓"], ["Giraffe", "🦒"], ["Panda", "🐼"], ["Koala", "🐨"],
        ["Kangaroo", "🦘"], ["Fox", "🦊"], ["Wolf", "🐺"], ["Deer", "🦌"], ["Squirrel", "🐿️"],
        ["Hedgehog", "🦔"], ["Bat", "🦇"], ["Snail", "🐌"], ["Snake", "🐍"], ["Spider", "🕷️"],
        ["Ladybug", "🐞"], ["Ant", "🐜"], ["Caterpillar", "🐛"], ["Worm", "🪱"], ["Octopus", "🐙"], ["Whale", "🐳"], ["Dolphin", "🐬"],
        ["Shark", "🦈"], ["Crab", "🦀"], ["Shrimp", "🦐"], ["Penguin", "🐧"], ["Peacock", "🦚"],
        ["Parrot", "🦜"], ["Flamingo", "🦩"], ["Swan", "🦢"], ["Rooster", "🐓"], ["Goat", "🐐"],
        ["Camel", "🐫"], ["Lizard", "🦎"], ["Leaf", "🍃"], ["Mushroom", "🍄"], ["Rock", "🪨"],
        ["Volcano", "🌋"], ["Mountain", "⛰️"], ["Ocean", "🌊"], ["Island", "🏝️"]
      ]
    },
    {
      name: "Pack 4: Yummy Food", icon: "🍕", color: "#fed7aa", difficulty: "Easy",
      words: [
        ["Orange", "🍊"], ["Strawberry", "🍓"], ["Grapes", "🍇"], ["Watermelon", "🍉"], ["Pineapple", "🍍"],
        ["Peach", "🍑"], ["Cherry", "🍒"], ["Lemon", "🍋"], ["Carrot", "🥕"], ["Corn", "🌽"],
        ["Broccoli", "🥦"], ["Potato", "🥔"], ["Tomato", "🍅"], ["Cucumber", "🥒"], ["Pepper", "🫑"], ["Pizza", "🍕"],
        ["Burger", "🍔"], ["Fries", "🍟"], ["Hot Dog", "🌭"], ["Taco", "🌮"], ["Sandwich", "🥪"],
        ["Popcorn", "🍿"], ["Donut", "🍩"], ["Ice Cream", "🍦"], ["Cupcake", "🧁"], ["Pie", "🥧"],
        ["Candy", "🍬"], ["Lollipop", "🍭"], ["Chocolate", "🍫"], ["Honey", "🍯"], ["Pancake", "🥞"],
        ["Bacon", "🥓"], ["Rice", "🍚"], ["Noodles", "🍜"], ["Soup", "🍲"], ["Juice", "🧃"]
      ]
    },
    {
      name: "Pack 5: Actions & Feelings", icon: "🤸", color: "#fbcfe8", difficulty: "Trickier",
      words: [
        ["Jump", "🤸"], ["Run", "🏃"], ["Walk", "🚶"], ["Sleep", "😴"], ["Eat", "🍴"],
        ["Drink", "🥤"], ["Laugh", "😂"], ["Hug", "🤗"], ["Wave", "👋"], ["Clap", "👏"],
        ["Dance", "💃"], ["Sing", "🎤"], ["Swim", "🏊"], ["Climb", "🧗"], ["Kiss", "😘"],
        ["Smile", "😊"], ["Happy", "😃"], ["Sad", "😢"], ["Angry", "😠"], ["Scared", "😱"],
        ["Surprised", "😲"], ["Sick", "🤒"], ["Tired", "🥱"], ["Cold", "🥶"], ["Hot", "🥵"],
        ["Love", "❤️"], ["Think", "🤔"], ["Wink", "😉"], ["Sneeze", "🤧"]
      ]
    },
    {
      name: "Pack 6: Colors & Shapes", icon: "🎨", color: "#ddd6fe", difficulty: "Trickier",
      words: [
        ["Red", "🔴"], ["Orange", "🟠"], ["Yellow", "🟡"], ["Green", "🟢"], ["Blue", "🔵"],
        ["Purple", "🟣"], ["Pink", "🩷"], ["Black", "⚫"], ["White", "⚪"], ["Brown", "🟤"],
        ["Circle", "⭕"], ["Square", "⬛"], ["Triangle", "🔺"], ["Heart", "❤️"], ["Diamond", "🔷"]
      ]
    },
    {
      name: "Pack 7: Weather & Places", icon: "🌈", color: "#fecaca", difficulty: "Trickier",
      words: [
        ["Rain", "🌧️"], ["Snow", "❄️"], ["Cloud", "☁️"], ["Rainbow", "🌈"], ["Wind", "💨"],
        ["Thunder", "⛈️"], ["Beach", "🏖️"], ["Park", "🏞️"], ["Farm", "🚜"], ["School", "🏫"],
        ["Store", "🏪"], ["House", "🏠"], ["City", "🏙️"], ["Bridge", "🌉"], ["Sunrise", "🌅"],
        ["Sunset", "🌇"], ["Night", "🌃"]
      ]
    },
    {
      name: "Pack 8: My Body", icon: "✋", color: "#fde68a", difficulty: "Easy",
      words: [
        ["Eyes", "👀"], ["Nose", "👃"], ["Mouth", "👄"], ["Ear", "👂"], ["Hand", "✋"],
        ["Foot", "🦶"], ["Teeth", "🦷"], ["Arm", "💪"], ["Leg", "🦵"], ["Tongue", "👅"]
      ]
    }
  ];

  const BG_COLORS = ["#fde68a", "#bbf7d0", "#bfdbfe", "#fbcfe8", "#fed7aa", "#ddd6fe", "#a7f3d0", "#fecaca"];

  let deck = [];
  let index = 0;

  const startScreen = document.getElementById("start");
  const deckScreen = document.getElementById("deck");
  const packListEl = document.getElementById("pack-list");
  const emojiEl = document.getElementById("emoji");
  const wordEl = document.getElementById("word");
  const counterEl = document.getElementById("counter");

  function speak(text) {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.85;
    u.pitch = 1.1;
    window.speechSynthesis.speak(u);
  }

  function renderPackList() {
    packListEl.innerHTML = PACKS.map((pack, i) => (
      '<button class="pack-btn" style="background:' + pack.color + '" data-pack="' + i + '">' +
        '<span class="pack-emoji">' + pack.icon + '</span>' +
        '<span class="pack-text">' +
          '<span class="pack-name">' + pack.name + '</span>' +
          '<span class="pack-meta">' + pack.difficulty + '</span>' +
        '</span>' +
        '<span class="pack-count">' + pack.words.length + '</span>' +
      '</button>'
    )).join("");

    packListEl.querySelectorAll(".pack-btn").forEach((btn) => {
      btn.addEventListener("click", () => startPack(PACKS[Number(btn.dataset.pack)]));
    });
  }

  function render(shouldSpeak) {
    const [word, emoji] = deck[index];
    emojiEl.textContent = emoji;
    wordEl.textContent = word;
    counterEl.textContent = (index + 1) + " / " + deck.length;
    deckScreen.style.backgroundColor = BG_COLORS[index % BG_COLORS.length];
    if (shouldSpeak) speak(word);
  }

  function next() {
    index = (index + 1) % deck.length;
    render(true);
  }

  function prev() {
    index = (index - 1 + deck.length) % deck.length;
    render(true);
  }

  function shuffleDeck() {
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    index = 0;
    render(true);
  }

  function startPack(pack) {
    // First user gesture: unlock speech synthesis on iOS Safari and request fullscreen.
    speak(" ");
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();

    deck = pack.words.slice();
    startScreen.style.display = "none";
    deckScreen.classList.add("active");
    shuffleDeck();
  }

  function goToPacks() {
    deckScreen.classList.remove("active");
    startScreen.style.display = "flex";
  }

  document.getElementById("zone-next").addEventListener("click", next);
  document.getElementById("zone-prev").addEventListener("click", prev);
  document.getElementById("card").addEventListener("click", () => render(true));
  document.getElementById("shuffle-btn").addEventListener("click", (e) => { e.stopPropagation(); shuffleDeck(); });
  document.getElementById("packs-btn").addEventListener("click", (e) => { e.stopPropagation(); goToPacks(); });

  document.addEventListener("keydown", (e) => {
    if (!deckScreen.classList.contains("active")) return;
    if (e.key === "ArrowRight") next();
    else if (e.key === "ArrowLeft") prev();
    else if (e.key === " ") render(true);
  });

  let touchStartX = null;
  deckScreen.addEventListener("touchstart", (e) => { touchStartX = e.touches[0].clientX; }, { passive: true });
  deckScreen.addEventListener("touchend", (e) => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 60) { dx < 0 ? next() : prev(); }
    touchStartX = null;
  }, { passive: true });

  renderPackList();
})();
</script>
</body>
</html>
