<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotwords</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
        }
        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .room-info {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
        }
        .room-info label {
            font-size: 0.9rem;
            color: #888;
            display: block;
            margin-bottom: 8px;
        }
        .room-input-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .room-input {
            font-size: 1.2rem;
            padding: 8px 16px;
            border: 2px solid rgba(138, 43, 226, 0.5);
            border-radius: 20px;
            background: rgba(138, 43, 226, 0.2);
            color: #fff;
            text-align: center;
            width: 160px;
            font-weight: bold;
        }
        .room-input:focus {
            outline: none;
            border-color: #8a2be2;
            background: rgba(138, 43, 226, 0.3);
        }
        .join-btn {
            font-size: 1rem;
            padding: 8px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            background: linear-gradient(135deg, #8a2be2 0%, #6a1cb2 100%);
            color: #fff;
            transition: all 0.3s ease;
        }
        .join-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(138, 43, 226, 0.4);
        }
        .join-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .word-display {
            font-size: 3rem;
            font-weight: bold;
            margin: 40px 0;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            text-shadow: 0 0 30px rgba(78, 205, 196, 0.8);
            color: #4ecdc4;
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.3s ease;
        }
        .word-display.redacted {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            text-shadow: none;
        }
        .word-display.redacted .word-text {
            opacity: 0;
        }
        .word-display .word-text {
            transition: opacity 0.3s ease;
        }
        .word-display .redact-label {
            position: absolute;
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .word-display.redacted .redact-label {
            opacity: 1;
        }
        .score-display {
            text-align: center;
            margin: 20px 0;
        }
        .score-number {
            font-size: 4rem;
            font-weight: bold;
            color: #f9ca24;
            text-shadow: 0 0 30px rgba(249, 202, 36, 0.6);
            line-height: 1;
        }
        .score-label {
            font-size: 1rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .timer-display {
            font-size: 2rem;
            font-weight: bold;
            color: #4ecdc4;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        .timer-display.active {
            opacity: 1;
        }
        .timer-display.warning {
            color: #f9ca24;
        }
        .timer-display.danger {
            color: #ff6b6b;
            animation: pulse 0.5s ease-in-out infinite;
        }
        .status {
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 20px;
            min-height: 30px;
        }
        .status.listening {
            color: #4ecdc4;
        }
        .status.winner {
            color: #ff6b6b;
            font-weight: bold;
            animation: pulse 0.5s ease-in-out 3;
        }
        .status.skipped {
            color: #f9ca24;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        button {
            font-size: 1.2rem;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .listen-btn {
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
            color: #fff;
        }
        .listen-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(78, 205, 196, 0.4);
        }
        .listen-btn.active {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
        }
        .skip-btn {
            background: linear-gradient(135deg, #f9ca24 0%, #f0932b 100%);
            color: #1a1a2e;
            font-weight: bold;
        }
        .skip-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(249, 202, 36, 0.4);
        }
        .button-row {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .transcript {
            margin-top: 30px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            font-size: 0.9rem;
            color: #888;
            min-height: 50px;
        }
        .transcript span {
            color: #4ecdc4;
        }
        .similarity {
            font-size: 0.8rem;
            color: #666;
            margin-top: 5px;
        }
        .similarity.close {
            color: #f9ca24;
        }
        .player-input {
            margin-bottom: 20px;
        }
        .player-input input {
            font-size: 1rem;
            padding: 10px 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            text-align: center;
            width: 200px;
        }
        .player-input input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        .player-input input:focus {
            outline: none;
            border-color: #4ecdc4;
        }
        .error {
            color: #ff6b6b;
            margin-top: 20px;
        }

        /* Celebration overlay */
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            overflow: hidden;
            opacity: 0;
            background: rgba(26, 26, 46, 0.95);
            transition: opacity 0.3s ease;
        }
        .celebration.active {
            opacity: 1;
        }
        .celebration-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1001;
            width: 90%;
        }
        .celebration-text {
            font-size: 15vw;
            font-weight: bold;
            color: #4ecdc4;
            text-shadow: 0 0 40px rgba(78, 205, 196, 1), 0 0 80px rgba(78, 205, 196, 0.8), 0 0 120px rgba(78, 205, 196, 0.6);
            animation: celebratePulse 0.4s ease-in-out infinite alternate;
            line-height: 1.1;
            text-transform: uppercase;
        }
        .celebration-winner {
            font-size: 1.5rem;
            color: #ff6b6b;
            margin-top: 30px;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.8);
        }
        @keyframes celebratePulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* Explosion particles */
        .particle {
            position: absolute;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            animation: explode 2s ease-out forwards;
        }
        @keyframes explode {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(1);
                opacity: 0;
            }
        }

        /* Confetti */
        .confetti {
            position: absolute;
            width: 10px;
            height: 20px;
            animation: confettiFall 2s ease-out forwards;
        }
        @keyframes confettiFall {
            0% {
                transform: translateY(-100%) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Screen flash */
        .celebration-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(255,107,107,0.6) 0%, transparent 70%);
            animation: flash 0.5s ease-out forwards;
        }
        @keyframes flash {
            0% { opacity: 1; transform: scale(0.5); }
            100% { opacity: 0; transform: scale(2); }
        }

        /* Pass This Device Mode Styles */
        .mode-toggle {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
        }
        .mode-toggle label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            font-size: 1rem;
            color: #ccc;
        }
        .mode-toggle input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #8a2be2;
        }
        .player-setup {
            display: none;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(138, 43, 226, 0.1);
            border-radius: 15px;
            border: 2px solid rgba(138, 43, 226, 0.3);
        }
        .player-setup.active {
            display: block;
        }
        .player-setup h3 {
            margin: 0 0 15px 0;
            color: #8a2be2;
            font-size: 1rem;
        }
        .player-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }
        .player-entry {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .player-entry input {
            flex: 1;
            font-size: 0.9rem;
            padding: 8px 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        .player-entry input:focus {
            outline: none;
            border-color: #8a2be2;
        }
        .player-entry .remove-player {
            width: 30px;
            height: 30px;
            padding: 0;
            border-radius: 50%;
            font-size: 1.2rem;
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            border: none;
            cursor: pointer;
        }
        .player-entry .remove-player:hover {
            background: rgba(255, 107, 107, 0.4);
        }
        .add-player-btn {
            font-size: 0.9rem;
            padding: 8px 16px;
            border: 2px dashed rgba(138, 43, 226, 0.5);
            border-radius: 20px;
            background: transparent;
            color: #8a2be2;
            cursor: pointer;
            width: 100%;
        }
        .add-player-btn:hover {
            background: rgba(138, 43, 226, 0.1);
        }
        .start-pass-game-btn {
            margin-top: 10px;
            font-size: 1rem;
            padding: 10px 20px;
            background: linear-gradient(135deg, #8a2be2 0%, #6a1cb2 100%);
            color: #fff;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
        }
        .start-pass-game-btn:hover {
            box-shadow: 0 5px 20px rgba(138, 43, 226, 0.4);
        }
        .start-pass-game-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Pass Device Interstitial */
        .pass-interstitial {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            z-index: 2000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .pass-interstitial.active {
            display: flex;
        }
        .pass-interstitial h2 {
            font-size: 1.5rem;
            color: #888;
            margin-bottom: 20px;
        }
        .pass-interstitial .next-player-name {
            font-size: 3rem;
            font-weight: bold;
            color: #4ecdc4;
            text-shadow: 0 0 30px rgba(78, 205, 196, 0.8);
            margin-bottom: 30px;
        }
        .pass-interstitial .ready-btn {
            font-size: 1.5rem;
            padding: 20px 60px;
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
        }
        .pass-interstitial .ready-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(78, 205, 196, 0.4);
        }

        /* Local Scoreboard */
        .local-scoreboard {
            display: none;
            margin: 20px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
        }
        .local-scoreboard.active {
            display: block;
        }
        .local-scoreboard h3 {
            margin: 0 0 10px 0;
            font-size: 0.9rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .scoreboard-entries {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .scoreboard-entry {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        .scoreboard-entry.current {
            background: rgba(78, 205, 196, 0.2);
            border: 1px solid rgba(78, 205, 196, 0.4);
        }
        .scoreboard-entry .player-name {
            color: #fff;
        }
        .scoreboard-entry .player-score {
            color: #f9ca24;
            font-weight: bold;
        }

        /* Current Player Indicator */
        .current-player-indicator {
            display: none;
            margin-bottom: 15px;
            padding: 10px 20px;
            background: rgba(78, 205, 196, 0.2);
            border: 2px solid rgba(78, 205, 196, 0.4);
            border-radius: 25px;
            color: #4ecdc4;
            font-weight: bold;
        }
        .current-player-indicator.active {
            display: inline-block;
        }

        /* Orientation Indicator */
        .orientation-indicator {
            display: none;
            margin-bottom: 15px;
            padding: 10px 20px;
            background: rgba(249, 202, 36, 0.2);
            border: 2px solid rgba(249, 202, 36, 0.4);
            border-radius: 25px;
            color: #f9ca24;
            font-size: 0.9rem;
        }
        .orientation-indicator.active {
            display: block;
        }
        .orientation-indicator.flat {
            background: rgba(78, 205, 196, 0.2);
            border-color: rgba(78, 205, 196, 0.4);
            color: #4ecdc4;
        }

        /* Word hidden by orientation */
        .word-display.orientation-hidden {
            background: linear-gradient(135deg, #2d2d44 0%, #1a1a2e 100%);
        }
        .word-display.orientation-hidden .word-text {
            opacity: 0;
        }
        .word-display .orientation-label {
            position: absolute;
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            text-shadow: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            text-align: center;
            line-height: 1.4;
        }
        .word-display.orientation-hidden .orientation-label {
            opacity: 1;
        }

        /* Hide online-only elements in pass mode */
        .pass-mode-active .room-info,
        .pass-mode-active .player-input,
        .pass-mode-active .transcript,
        .pass-mode-active #scoreDisplay {
            display: none;
        }

        /* Close Match Anticipation Overlay */
        .close-match-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(249, 202, 36, 0.15);
            z-index: 500;
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .close-match-overlay.active {
            display: flex;
            animation: closeMatchPulse 0.3s ease-in-out infinite alternate;
        }
        .close-match-text {
            font-size: 20vw;
            font-weight: bold;
            color: #f9ca24;
            text-shadow: 0 0 40px rgba(249, 202, 36, 0.8), 0 0 80px rgba(249, 202, 36, 0.5);
            animation: closeMatchBounce 0.2s ease-in-out infinite alternate;
        }
        .close-match-pct {
            position: absolute;
            bottom: 20%;
            font-size: 3rem;
            color: #f9ca24;
            text-shadow: 0 0 20px rgba(249, 202, 36, 0.8);
        }
        @keyframes closeMatchPulse {
            0% { background: rgba(249, 202, 36, 0.1); }
            100% { background: rgba(249, 202, 36, 0.25); }
        }
        @keyframes closeMatchBounce {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <h1><span id="wordCount">-</span> words</h1>

        <!-- Mode Toggle -->
        <div class="mode-toggle">
            <label>
                <input type="checkbox" id="passModeTog">
                Pass This Device Mode
            </label>
        </div>

        <!-- Player Setup (Pass Mode) -->
        <div class="player-setup" id="playerSetup">
            <h3>Add Players</h3>
            <div class="player-list" id="playerList">
                <div class="player-entry">
                    <input type="text" placeholder="Player 1" maxlength="20">
                    <button class="remove-player" onclick="removePlayer(this)">&times;</button>
                </div>
                <div class="player-entry">
                    <input type="text" placeholder="Player 2" maxlength="20">
                    <button class="remove-player" onclick="removePlayer(this)">&times;</button>
                </div>
            </div>
            <button class="add-player-btn" id="addPlayerBtn">+ Add Player</button>
            <button class="start-pass-game-btn" id="startPassGameBtn">Start Game</button>
        </div>

        <!-- Online Mode: Room Selection -->
        <div class="room-info">
            <label>Room</label>
            <div class="room-input-row">
                <input type="text" class="room-input" id="roomInput" maxlength="20" spellcheck="false">
                <button class="join-btn" id="randomBtn">Random</button>
            </div>
        </div>

        <div class="player-input">
            <input type="text" id="playerName" placeholder="Enter your name" maxlength="20">
        </div>

        <!-- Current Player Indicator (Pass Mode) -->
        <div class="current-player-indicator" id="currentPlayerIndicator"></div>

        <!-- Orientation Indicator (Pass Mode) -->
        <div class="orientation-indicator" id="orientationIndicator">
            Hold device flat to see word
        </div>

        <div class="word-display" id="wordContainer">
            <span class="word-text" id="currentWord">Connecting...</span>
            <span class="redact-label">MEMORIZE THE PHRASE!</span>
            <span class="orientation-label">Hold device flat<br>(screen facing up)<br>to reveal word</span>
        </div>

        <div class="score-display" id="scoreDisplay">
            <div class="score-number" id="scoreCount">0</div>
            <div class="score-label">points</div>
        </div>

        <div class="timer-display" id="timerDisplay">
            <span id="timerCount">40</span>s
        </div>

        <div class="status" id="status">Click the button to start listening</div>

        <div class="button-row">
            <button class="listen-btn" id="listenBtn" disabled>Start Listening</button>
            <button class="skip-btn" id="skipBtn" disabled>Skip Word</button>
        </div>

        <div class="transcript">
            Heard: <span id="transcript">-</span>
            <div class="similarity" id="similarity"></div>
        </div>

        <!-- Local Scoreboard (Pass Mode) -->
        <div class="local-scoreboard" id="localScoreboard">
            <h3>Scoreboard</h3>
            <div class="scoreboard-entries" id="scoreboardEntries"></div>
        </div>

        <div class="error" id="error"></div>
    </div>

    <!-- Pass Device Interstitial -->
    <div class="pass-interstitial" id="passInterstitial">
        <h2>Pass the device to</h2>
        <div class="next-player-name" id="nextPlayerName">Player</div>
        <button class="ready-btn" id="readyBtn">I'm Ready!</button>
    </div>

    <!-- Close Match Anticipation Overlay -->
    <div class="close-match-overlay" id="closeMatchOverlay">
        <div class="close-match-text">CLOSE!</div>
        <div class="close-match-pct" id="closeMatchPct">85%</div>
    </div>

    <!-- Celebration overlay -->
    <div class="celebration" id="celebration">
        <div class="celebration-content">
            <div class="celebration-text" id="celebrationWord"></div>
            <div class="celebration-winner" id="winnerName"></div>
        </div>
    </div>

    <script>
        const wordDisplay = document.getElementById('currentWord');
        const wordContainer = document.getElementById('wordContainer');
        const statusEl = document.getElementById('status');
        const listenBtn = document.getElementById('listenBtn');
        const skipBtn = document.getElementById('skipBtn');
        const transcriptEl = document.getElementById('transcript');
        const similarityEl = document.getElementById('similarity');
        const playerNameInput = document.getElementById('playerName');
        const roomInput = document.getElementById('roomInput');
        const randomBtn = document.getElementById('randomBtn');
        const errorEl = document.getElementById('error');
        const celebrationEl = document.getElementById('celebration');
        const winnerNameEl = document.getElementById('winnerName');
        const celebrationWordEl = document.getElementById('celebrationWord');
        const closeMatchOverlay = document.getElementById('closeMatchOverlay');
        const closeMatchPct = document.getElementById('closeMatchPct');
        const scoreCountEl = document.getElementById('scoreCount');
        const wordCountEl = document.getElementById('wordCount');
        const timerDisplayEl = document.getElementById('timerDisplay');
        const timerCountEl = document.getElementById('timerCount');

        let currentWord = '';
        let ws = null;
        let recognition = null;
        let isListening = false;
        let hasClaimedVictory = false;
        let currentRoomId = '';
        let isReconnecting = false;
        let redactTimer = null;
        let isCelebrating = false;
        let pendingWord = null;
        let gameTimer = null;
        let timeRemaining = 40;
        let localScore = 0;
        let gameActive = false;
        const REDACT_DELAY = 2500; // 2.5 seconds
        const CELEBRATION_DELAY = 2000; // 2 seconds
        const GAME_DURATION = 40; // 40 seconds

        // Pass Mode elements
        const passModeTog = document.getElementById('passModeTog');
        const playerSetup = document.getElementById('playerSetup');
        const playerList = document.getElementById('playerList');
        const addPlayerBtn = document.getElementById('addPlayerBtn');
        const startPassGameBtn = document.getElementById('startPassGameBtn');
        const passInterstitial = document.getElementById('passInterstitial');

        // Levenshtein distance for similarity checking
        function levenshteinDistance(str1, str2) {
            const m = str1.length;
            const n = str2.length;
            const dp = Array(m + 1).fill(null).map(() => Array(n + 1).fill(0));

            for (let i = 0; i <= m; i++) dp[i][0] = i;
            for (let j = 0; j <= n; j++) dp[0][j] = j;

            for (let i = 1; i <= m; i++) {
                for (let j = 1; j <= n; j++) {
                    if (str1[i - 1] === str2[j - 1]) {
                        dp[i][j] = dp[i - 1][j - 1];
                    } else {
                        dp[i][j] = 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
                    }
                }
            }
            return dp[m][n];
        }

        // Calculate similarity percentage
        function similarity(str1, str2) {
            const s1 = str1.toLowerCase().trim();
            const s2 = str2.toLowerCase().trim();
            if (s1 === s2) return 1;
            const maxLen = Math.max(s1.length, s2.length);
            if (maxLen === 0) return 1;
            const distance = levenshteinDistance(s1, s2);
            return (maxLen - distance) / maxLen;
        }

        // Check if transcript matches current phrase (with fuzzy matching)
        function checkMatch(transcript) {
            if (!currentWord || hasClaimedVictory) return { matched: false, similarity: 0 };

            const targetLower = currentWord.toLowerCase().trim();
            const heardLower = transcript.toLowerCase().trim();

            // Exact match
            if (heardLower.includes(targetLower)) {
                return { matched: true, similarity: 1 };
            }

            // Check similarity of the full phrase against windows in transcript
            const targetWords = targetLower.split(/\s+/);
            const heardWords = heardLower.split(/\s+/);

            let bestSimilarity = 0;

            // Sliding window over heard words
            for (let i = 0; i <= heardWords.length - targetWords.length; i++) {
                const windowPhrase = heardWords.slice(i, i + targetWords.length).join(' ');
                const sim = similarity(windowPhrase, targetLower);
                bestSimilarity = Math.max(bestSimilarity, sim);
            }

            // Also check full transcript similarity
            const fullSim = similarity(heardLower, targetLower);
            bestSimilarity = Math.max(bestSimilarity, fullSim);

            // Check each word individually and average (for partial matches)
            if (targetWords.length > 1) {
                for (let i = 0; i <= heardWords.length - targetWords.length; i++) {
                    let wordMatchSum = 0;
                    for (let j = 0; j < targetWords.length; j++) {
                        const wordSim = similarity(heardWords[i + j] || '', targetWords[j]);
                        wordMatchSum += wordSim;
                    }
                    const avgSim = wordMatchSum / targetWords.length;
                    bestSimilarity = Math.max(bestSimilarity, avgSim);
                }
            }

            // 85% similarity threshold for fuzzy match
            const SIMILARITY_THRESHOLD = 0.85;
            return {
                matched: bestSimilarity >= SIMILARITY_THRESHOLD,
                similarity: bestSimilarity
            };
        }

        // Connect to WebSocket

            // Close existing connection if any
            if (ws) {

                ws.close();

            currentRoomId = roomId;
            updateUrl(roomId);
            roomInput.value = roomId;

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/game/${roomId}`);

            ws.onopen = () => {
                isReconnecting = false;
                statusEl.textContent = 'Connected! Click to start listening.';
                listenBtn.disabled = false;
                skipBtn.disabled = false;
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);

                if (msg.type === 'NEW_WORD') {
                    // If celebrating, queue the word for later
                    if (isCelebrating) {
                        pendingWord = msg.word;
                    } else {
                        showNewWord(msg.word);
                    }
                } else if (msg.type === 'ROUND_WON') {
                    // Update local score if game is active
                    incrementLocalScore();
                    statusEl.textContent = `${msg.player} won the round!`;
                    statusEl.classList.remove('listening', 'skipped');
                    statusEl.classList.add('winner');

                    statusEl.textContent = `${skipper} skipped the word`;
                    statusEl.classList.remove('listening', 'winner');
                    statusEl.classList.add('skipped');

                    // Only update if game not active (initial load)

                    }
                }

                skipBtn.disabled = true;

                    statusEl.textContent = 'Disconnected. Reconnecting...';
                    setTimeout(() => connect(currentRoomId), 2000);

            ws.onerror = () => {
                statusEl.textContent = 'Connection error';
            };
        }

        // Initialize Speech Recognition
        function initSpeechRecognition() {
            if (!SpeechRecognition) return;

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                transcriptEl.textContent = transcript || '-';

                // Check for match with similarity
                const result = checkMatch(transcript);

                if (result.similarity > 0 && result.similarity < 1) {
                    const pct = Math.round(result.similarity * 100);
                    similarityEl.textContent = `${pct}% match`;
                    similarityEl.classList.toggle('close', result.similarity >= 0.7);

                    // Show "CLOSE!" anticipation overlay when >80% but not yet matched
                    if (result.similarity >= 0.80 && !result.matched && !hasClaimedVictory) {
                        closeMatchPct.textContent = `${pct}%`;
                        closeMatchOverlay.classList.add('active');
                    } else {
                        closeMatchOverlay.classList.remove('active');
                    }
                } else {
                    similarityEl.textContent = '';
                    closeMatchOverlay.classList.remove('active');
                }

                if (result.matched && !hasClaimedVictory) {
                    hasClaimedVictory = true;
                    closeMatchOverlay.classList.remove('active');
                    claimVictory();
                }
            };

            recognition.onerror = (event) => {
                if (event.error === 'not-allowed') {
                    errorEl.textContent = 'Microphone access denied. Please allow microphone access and refresh.';
                } else if (event.error !== 'aborted') {
                    console.log('Speech recognition error:', event.error);
                }
            };

            recognition.onend = () => {
                // Restart if still supposed to be listening
                if (isListening) {
                    recognition.start();
                }
            };
        }

        // ========== DEVICE ORIENTATION ==========

        let orientationHandler = null;

        function enableOrientationDetection() {
            // Check if DeviceOrientationEvent is available
            if (!window.DeviceOrientationEvent) {
                console.log('DeviceOrientation not supported');
                orientationIndicator.textContent = 'Orientation not supported';
                orientationIndicator.classList.add('active');
                return;
            }

            // iOS 13+ requires permission
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            startOrientationListening();
                        } else {
                            console.log('Orientation permission denied');
                            orientationIndicator.textContent = 'Orientation permission denied';
                            orientationIndicator.classList.add('active');
                        }
                    })
                    .catch(err => {
                        console.log('Orientation permission error:', err);
                    });
            } else {
                // Non-iOS or older iOS
                startOrientationListening();
            }
        }

        let orientationDataReceived = false;
        let orientationCheckTimeout = null;

        function startOrientationListening() {
            orientationEnabled = true;
            orientationIndicator.classList.add('active');
            orientationDataReceived = false;

            orientationHandler = (event) => {
                const beta = event.beta;  // -180 to 180 (front-to-back tilt)
                const gamma = event.gamma; // -90 to 90 (left-to-right tilt)

                // Check if we're getting real data (not null/0)
                if (beta !== null && beta !== 0) {
                    orientationDataReceived = true;
                }

                // Device is "flat" when beta is close to 0 and gamma is close to 0
                // beta ~= 0 means screen facing up
                // beta ~= 90 means screen facing user (upright)
                // Adding some hysteresis to prevent flicker

                const flatThreshold = 35;
                const uprightThreshold = 45;

                if (beta !== null) {
                    const absBeta = Math.abs(beta);

                    if (absBeta < flatThreshold && Math.abs(gamma) < flatThreshold) {
                        if (!deviceIsFlat) {
                            deviceIsFlat = true;
                            updateWordVisibilityByOrientation();
                        }
                    } else if (absBeta > uprightThreshold || Math.abs(gamma) > uprightThreshold) {
                        if (deviceIsFlat) {
                            deviceIsFlat = false;
                            updateWordVisibilityByOrientation();
                        }
                    }
                }
            };

            window.addEventListener('deviceorientation', orientationHandler);

            // Check after 1 second if we received orientation data
            // If not, fall back to tap-to-reveal mode
            orientationCheckTimeout = setTimeout(() => {
                if (!orientationDataReceived) {
                    console.log('No orientation data - falling back to tap-to-reveal');
                    enableTapToReveal();
                }
            }, 1000);

            updateWordVisibilityByOrientation();
        }

        // Tap-to-reveal fallback for laptops/desktops
        let tapToRevealEnabled = false;

        function enableTapToReveal() {
            orientationEnabled = false;
            tapToRevealEnabled = true;
            deviceIsFlat = false;

            // Update UI for tap mode
            orientationIndicator.textContent = 'Tap word area to reveal/hide';
            orientationIndicator.classList.add('active');
            wordContainer.classList.add('orientation-hidden');

            // Add click handler to word container
            wordContainer.addEventListener('click', toggleWordVisibility);
            wordContainer.style.cursor = 'pointer';
        }

        function toggleWordVisibility() {
            if (!tapToRevealEnabled || !passModeActive) return;

            deviceIsFlat = !deviceIsFlat;
            if (deviceIsFlat) {
                wordContainer.classList.remove('orientation-hidden');
                orientationIndicator.textContent = 'Tap to hide word';
                orientationIndicator.classList.add('flat');
            } else {
                wordContainer.classList.add('orientation-hidden');
                orientationIndicator.textContent = 'Tap word area to reveal';
                orientationIndicator.classList.remove('flat');
            }
        }

        function updateWordVisibilityByOrientation() {
            if (!orientationEnabled && !tapToRevealEnabled) return;

            if (deviceIsFlat) {
                wordContainer.classList.remove('orientation-hidden');
                wordContainer.classList.remove('redacted');
                if (tapToRevealEnabled) {
                    orientationIndicator.textContent = 'Tap to hide word';
                } else {
                    orientationIndicator.textContent = 'Word visible - memorize it!';
                }
                orientationIndicator.classList.add('flat');
            } else {
                wordContainer.classList.add('orientation-hidden');
                wordContainer.classList.remove('redacted');
                if (tapToRevealEnabled) {
                    orientationIndicator.textContent = 'Tap word area to reveal';
                } else {
                    orientationIndicator.textContent = 'Hold device flat to see word';
                }
                orientationIndicator.classList.remove('flat');
            }

            updateButtonsForMode();
        }

        function disableOrientationDetection() {
            orientationEnabled = false;
            deviceIsFlat = false;
            tapToRevealEnabled = false;
            if (orientationHandler) {
                window.removeEventListener('deviceorientation', orientationHandler);
                orientationHandler = null;
            }
            if (orientationCheckTimeout) {
                clearTimeout(orientationCheckTimeout);
                orientationCheckTimeout = null;
            }
            wordContainer.removeEventListener('click', toggleWordVisibility);
            wordContainer.style.cursor = '';
            wordContainer.classList.remove('orientation-hidden');
            orientationIndicator.classList.remove('active', 'flat');
        }

        // Initial button state update
        updateStartButton();
    </script>
</body>
</html>
