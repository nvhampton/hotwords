<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotwords</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
        }
        .word-progress {
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 15px;
            font-family: monospace;
            letter-spacing: 2px;
            min-height: 40px;
        }
        .word-progress .player-name {
            color: #4ecdc4;
            margin-right: 10px;
        }
        .word-progress .word-hidden {
            color: #666;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            margin: 0 3px;
            display: inline-block;
        }
        .word-progress .word-revealed {
            color: #4ecdc4;
            text-shadow: 0 0 10px rgba(78, 205, 196, 0.8);
            margin: 0 3px;
            display: inline-block;
            animation: wordReveal 0.3s ease-out;
        }
        .word-display .word-hidden {
            color: #666;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 6px;
            margin: 0 4px;
            display: inline-block;
        }
        .word-display .word-revealed {
            color: #4ecdc4;
            text-shadow: 0 0 10px rgba(78, 205, 196, 0.8);
            margin: 0 4px;
            display: inline-block;
            animation: wordReveal 0.3s ease-out;
        }
        @keyframes wordReveal {
            0% { transform: scale(1.3); color: #f9ca24; }
            100% { transform: scale(1); color: #4ecdc4; }
        }
        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .room-info {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
        }
        .room-info label {
            font-size: 0.9rem;
            color: #888;
            display: block;
            margin-bottom: 8px;
        }
        .room-input-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .room-input {
            font-size: 1.2rem;
            padding: 8px 16px;
            border: 2px solid rgba(138, 43, 226, 0.5);
            border-radius: 20px;
            background: rgba(138, 43, 226, 0.2);
            color: #fff;
            text-align: center;
            width: 160px;
            font-weight: bold;
        }
        .room-input:focus {
            outline: none;
            border-color: #8a2be2;
            background: rgba(138, 43, 226, 0.3);
        }
        .join-btn {
            font-size: 1rem;
            padding: 8px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            background: linear-gradient(135deg, #8a2be2 0%, #6a1cb2 100%);
            color: #fff;
            transition: all 0.3s ease;
        }
        .join-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(138, 43, 226, 0.4);
        }
        .join-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .word-display {
            font-size: 3rem;
            font-weight: bold;
            margin: 40px 0;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            text-shadow: 0 0 30px rgba(78, 205, 196, 0.8);
            color: #4ecdc4;
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.3s ease;
        }
        .word-display.redacted {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            text-shadow: none;
        }
        .word-display.redacted .word-text {
            opacity: 0;
        }
        .word-display .word-text {
            transition: opacity 0.3s ease;
        }
        .word-display .redact-label {
            position: absolute;
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .word-display.redacted .redact-label,
        .word-display.orientation-hidden .redact-label {
            opacity: 1;
        }
        .redact-label .reveal-hint {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.6;
        }
        .redact-label .hint-keys {
            font-size: 0.9rem;
            opacity: 0.6;
        }
        .key-hint {
            font-size: 0.7em;
            opacity: 0.6;
            font-weight: normal;
        }

        /* Dramatic countdown flash */
        @keyframes dangerFlash {
            0%, 100% { background-color: transparent; }
            50% { background-color: rgba(255, 0, 0, 0.3); }
        }
        .danger-flash {
            animation: dangerFlash 1s ease-in-out;
        }
        body.countdown-danger {
            animation: dangerPulse 1s ease-in-out infinite;
        }
        @keyframes dangerPulse {
            0%, 100% { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); }
            50% { background: linear-gradient(135deg, #3a1a1e 0%, #2e1620 100%); }
        }
        .score-display {
            text-align: center;
            margin: 20px 0;
        }
        .score-number {
            font-size: 4rem;
            font-weight: bold;
            color: #f9ca24;
            text-shadow: 0 0 30px rgba(249, 202, 36, 0.6);
            line-height: 1;
        }
        .score-label {
            font-size: 1rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .timer-display {
            font-size: 2rem;
            font-weight: bold;
            color: #4ecdc4;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        .timer-display.active {
            opacity: 1;
        }
        .timer-display.warning {
            color: #f9ca24;
        }
        .timer-display.danger {
            color: #ff6b6b;
            animation: pulse 0.5s ease-in-out infinite;
        }
        .status {
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 20px;
            min-height: 30px;
        }
        .status.listening {
            color: #4ecdc4;
        }
        .status.winner {
            color: #ff6b6b;
            font-weight: bold;
            animation: pulse 0.5s ease-in-out 3;
        }
        .status.skipped {
            color: #f9ca24;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        button {
            font-size: 1.2rem;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .gotit-btn {
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
            color: #fff;
            font-size: 1.3rem;
            padding: 18px 50px;
        }
        .gotit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(78, 205, 196, 0.4);
        }
        .skip-btn {
            background: linear-gradient(135deg, #f9ca24 0%, #f0932b 100%);
            color: #1a1a2e;
            font-weight: bold;
        }
        .skip-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(249, 202, 36, 0.4);
        }
        .play-again-btn {
            background: linear-gradient(135deg, #8a2be2 0%, #6a1cb2 100%);
            color: #fff;
            font-weight: bold;
            padding: 12px 30px;
            font-size: 1.1rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
        }
        .play-again-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(138, 43, 226, 0.4);
        }
        .button-row {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .listen-row {
            margin-top: 15px;
        }
        .listen-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #888;
            font-size: 0.9rem;
            padding: 8px 20px;
        }
        .listen-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }
        .listen-btn.active {
            background: rgba(255, 107, 107, 0.2);
            border-color: rgba(255, 107, 107, 0.4);
            color: #ff6b6b;
        }
        .transcript {
            margin-top: 30px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            font-size: 0.9rem;
            color: #888;
            min-height: 50px;
        }
        .transcript span {
            color: #4ecdc4;
        }
        .audio-disclaimer {
            display: none;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 8px;
            font-style: italic;
        }
        .transcript.listening .audio-disclaimer {
            display: block;
        }
        .similarity {
            font-size: 0.8rem;
            color: #666;
            margin-top: 5px;
        }
        .similarity.close {
            color: #f9ca24;
        }
        .player-input {
            margin-bottom: 20px;
        }
        .player-input input {
            font-size: 1rem;
            padding: 10px 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            text-align: center;
            width: 200px;
        }
        .player-input input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        .player-input input:focus {
            outline: none;
            border-color: #4ecdc4;
        }
        .error {
            color: #ff6b6b;
            margin-top: 20px;
        }

        /* Celebration overlay */
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            overflow: hidden;
            opacity: 0;
            background: rgba(26, 26, 46, 0.95);
            transition: opacity 0.3s ease;
        }
        .celebration.active {
            opacity: 1;
        }
        .celebration-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1001;
            width: 90%;
        }
        .celebration-text {
            font-size: 15vw;
            font-weight: bold;
            color: #4ecdc4;
            text-shadow: 0 0 40px rgba(78, 205, 196, 1), 0 0 80px rgba(78, 205, 196, 0.8), 0 0 120px rgba(78, 205, 196, 0.6);
            animation: celebratePulse 0.4s ease-in-out infinite alternate;
            line-height: 1.1;
            text-transform: uppercase;
        }
        .celebration-winner {
            font-size: 1.5rem;
            color: #ff6b6b;
            margin-top: 30px;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.8);
        }
        @keyframes celebratePulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* Explosion particles */
        .particle {
            position: absolute;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            animation: explode 2s ease-out forwards;
        }
        @keyframes explode {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(1);
                opacity: 0;
            }
        }

        /* Confetti */
        .confetti {
            position: absolute;
            width: 10px;
            height: 20px;
            animation: confettiFall 2s ease-out forwards;
        }
        @keyframes confettiFall {
            0% {
                transform: translateY(-100%) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Screen flash */
        .celebration-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(255,107,107,0.6) 0%, transparent 70%);
            animation: flash 0.5s ease-out forwards;
        }
        @keyframes flash {
            0% { opacity: 1; transform: scale(0.5); }
            100% { opacity: 0; transform: scale(2); }
        }

        /* Leaderboard Overlay */
        .leaderboard-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 46, 0.97);
            z-index: 1100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .leaderboard-overlay.active {
            display: flex;
        }
        .leaderboard-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 30px;
            max-width: 440px;
            width: 100%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }
        .leaderboard-title {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            color: #f9ca24;
            text-shadow: 0 0 20px rgba(249, 202, 36, 0.5);
            margin-bottom: 4px;
        }
        .leaderboard-subtitle {
            text-align: center;
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .leaderboard-list {
            overflow-y: auto;
            flex: 1;
            min-height: 0;
        }
        .leaderboard-percentile {
            text-align: center;
            padding: 10px 16px;
            margin-bottom: 16px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(249, 202, 36, 0.15), rgba(249, 202, 36, 0.05));
            border: 1px solid rgba(249, 202, 36, 0.3);
            color: #f9ca24;
            font-size: 1rem;
            font-weight: 600;
        }
        .leaderboard-entry {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 6px;
            background: rgba(255, 255, 255, 0.03);
            transition: background 0.2s;
        }
        .leaderboard-entry.is-you {
            background: rgba(78, 205, 196, 0.15);
            border: 1px solid rgba(78, 205, 196, 0.3);
        }
        .leaderboard-rank {
            font-size: 1.3rem;
            font-weight: bold;
            width: 40px;
            text-align: center;
            flex-shrink: 0;
        }
        .leaderboard-rank.gold { color: #f9ca24; }
        .leaderboard-rank.silver { color: #c0c0c0; }
        .leaderboard-rank.bronze { color: #cd7f32; }
        .leaderboard-details {
            flex: 1;
            margin-left: 10px;
            overflow: hidden;
            min-width: 0;
        }
        .leaderboard-players {
            font-size: 1rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .leaderboard-meta {
            display: flex;
            gap: 8px;
            margin-top: 2px;
            font-size: 0.75rem;
            color: #666;
        }
        .leaderboard-hash {
            font-family: monospace;
            color: #888;
        }
        .leaderboard-time {
            color: #666;
        }
        .leaderboard-score {
            font-size: 1.2rem;
            font-weight: bold;
            color: #4ecdc4;
            margin-left: 10px;
            flex-shrink: 0;
        }
        .leaderboard-empty {
            text-align: center;
            color: #666;
            padding: 30px;
            font-size: 1.1rem;
        }
        .leaderboard-divider {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            margin: 12px 0;
        }
        .leaderboard-grouped {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 14px;
            border-radius: 8px;
            margin-bottom: 4px;
            background: rgba(255, 255, 255, 0.02);
        }
        .leaderboard-grouped-score {
            font-weight: 600;
            color: #aaa;
        }
        .leaderboard-grouped-count {
            font-size: 0.85rem;
            color: #666;
        }
        .leaderboard-total {
            text-align: center;
            color: #555;
            font-size: 0.85rem;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        .leaderboard-close {
            margin-top: 16px;
            padding: 12px 30px;
            font-size: 1.1rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            color: #fff;
            transition: all 0.3s ease;
            align-self: center;
        }
        .leaderboard-close:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 107, 107, 0.4);
        }

        /* Player Setup */
        .player-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }
        .player-entry {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .player-entry input {
            flex: 1;
            font-size: 0.9rem;
            padding: 8px 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        .player-entry input:focus {
            outline: none;
            border-color: #8a2be2;
        }
        .player-entry .remove-player {
            width: 30px;
            height: 30px;
            padding: 0;
            border-radius: 50%;
            font-size: 1.2rem;
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            border: none;
            cursor: pointer;
        }
        .player-entry .remove-player:hover {
            background: rgba(255, 107, 107, 0.4);
        }
        .add-player-btn {
            font-size: 0.9rem;
            padding: 8px 16px;
            border: 2px dashed rgba(138, 43, 226, 0.5);
            border-radius: 20px;
            background: transparent;
            color: #8a2be2;
            cursor: pointer;
            width: 100%;
        }
        .add-player-btn:hover {
            background: rgba(138, 43, 226, 0.1);
        }
        .start-pass-game-btn {
            margin-top: 10px;
            font-size: 1rem;
            padding: 10px 20px;
            background: linear-gradient(135deg, #8a2be2 0%, #6a1cb2 100%);
            color: #fff;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
        }
        .start-pass-game-btn:hover {
            box-shadow: 0 5px 20px rgba(138, 43, 226, 0.4);
        }
        .start-pass-game-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Online Player List Panel */
        .online-player-panel {
            display: none;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 12px;
            margin-bottom: 15px;
        }
        .game-screen.online-mode .online-player-panel {
            display: block;
        }
        .online-player-panel h3 {
            font-size: 0.9rem;
            color: #888;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .online-players-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .online-player-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
        }
        .online-player-item.is-hot {
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.3) 0%, rgba(255, 107, 107, 0.1) 100%);
            border: 1px solid rgba(255, 107, 107, 0.3);
        }
        .online-player-item.is-me {
            border: 1px solid rgba(78, 205, 196, 0.3);
        }
        .online-player-item .player-badge {
            font-size: 1.1rem;
            width: 24px;
            text-align: center;
        }
        .online-player-item .player-name {
            flex: 1;
            font-size: 0.95rem;
            color: #fff;
        }
        .online-player-item.is-hot .player-name {
            color: #ff6b6b;
            font-weight: bold;
        }
        .online-player-item .player-role {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .online-player-item.is-hot .player-role {
            color: #ff6b6b;
        }

        /* Role indicator for word display */
        .role-indicator {
            display: none;
            font-size: 1.2rem;
            color: #ff6b6b;
            margin-bottom: 10px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .game-screen.online-mode .role-indicator {
            display: block;
        }
        .role-indicator.guesser {
            color: #4ecdc4;
        }

        /* Describer slip/fail penalties */
        .word-display.slip-penalty {
            animation: slipFlash 0.5s ease-out;
        }
        @keyframes slipFlash {
            0%, 100% { background: rgba(255, 255, 255, 0.1); }
            25%, 75% { background: rgba(255, 107, 107, 0.4); }
        }
        .word-display.describer-fail {
            animation: failShake 0.5s ease-out;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%) !important;
        }
        @keyframes failShake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        /* Lobby Screen */
        .lobby {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .lobby h1 {
            font-size: 3rem;
            margin-bottom: 30px;
            color: #ff6b6b;
        }
        .mode-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }
        .mode-section {
            border-radius: 25px;
            transition: all 0.3s ease;
            overflow: hidden;

         * Core:
         *   startGameTimer()        - 60s countdown
         *   endGame()               - Cleanup and show results
         *   showCelebration()       - Victory animation (online)
         *   showCelebrationLocal()  - Victory animation (local, shows next player)
         *   checkMatch()            - Fuzzy phrase matching
         *   similarity()            - Levenshtein distance
         *
         * Speech:
         *   initSpeechRecognition() - Setup Web Speech API
         *   updateRevealedWords()   - Check for individual words in transcript
         *
         * Reveal:
         *   enableOrientationDetection() - Device tilt or press-to-reveal

        // Screen elements

            if (words.includes(target)) return true;

        // Levenshtein distance for similarity checking
        function levenshteinDistance(str1, str2) {
            const m = str1.length;
            const n = str2.length;
            const dp = Array(m + 1).fill(null).map(() => Array(n + 1).fill(0));

            for (let i = 0; i <= m; i++) dp[i][0] = i;
            for (let j = 0; j <= n; j++) dp[0][j] = j;

            for (let i = 1; i <= m; i++) {
                for (let j = 1; j <= n; j++) {
                    if (str1[i - 1] === str2[j - 1]) {
                        dp[i][j] = dp[i - 1][j - 1];
                    } else {
                        dp[i][j] = 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
                    }
                }
            }
            return dp[m][n];
        }

        // Calculate similarity percentage
        function similarity(str1, str2) {
            const s1 = str1.toLowerCase().trim();
            const s2 = str2.toLowerCase().trim();
            if (s1 === s2) return 1;
            const maxLen = Math.max(s1.length, s2.length);
            if (maxLen === 0) return 1;
            const distance = levenshteinDistance(s1, s2);
            return (maxLen - distance) / maxLen;
        }

        // Check if transcript matches current phrase (with fuzzy matching)
        function checkMatch(transcript) {
            if (!currentWord || hasClaimedVictory) return { matched: false, similarity: 0 };

            const targetLower = currentWord.toLowerCase().trim();
            const heardLower = transcript.toLowerCase().trim();

            // Exact match
            if (heardLower.includes(targetLower)) {
                return { matched: true, similarity: 1 };
            }

            // Check similarity of the full phrase against windows in transcript
            const targetWords = targetLower.split(/\s+/);
            const heardWords = heardLower.split(/\s+/);

            let bestSimilarity = 0;

            // Sliding window over heard words
            for (let i = 0; i <= heardWords.length - targetWords.length; i++) {
                const windowPhrase = heardWords.slice(i, i + targetWords.length).join(' ');
                const sim = similarity(windowPhrase, targetLower);
                bestSimilarity = Math.max(bestSimilarity, sim);
            }

            // Also check full transcript similarity
            const fullSim = similarity(heardLower, targetLower);
            bestSimilarity = Math.max(bestSimilarity, fullSim);

            // Check each word individually and average (for partial matches)
            if (targetWords.length > 1) {
                for (let i = 0; i <= heardWords.length - targetWords.length; i++) {
                    let wordMatchSum = 0;
                    for (let j = 0; j < targetWords.length; j++) {
                        const wordSim = similarity(heardWords[i + j] || '', targetWords[j]);
                        wordMatchSum += wordSim;
                    }
                    const avgSim = wordMatchSum / targetWords.length;
                    bestSimilarity = Math.max(bestSimilarity, avgSim);
                }
            }

            // 85% similarity threshold for fuzzy match
            const SIMILARITY_THRESHOLD = 0.85;
            return {
                matched: bestSimilarity >= SIMILARITY_THRESHOLD,
                similarity: bestSimilarity
            };
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {

                statusEl.textContent = 'Describe it! (Monitoring for slips...)';

            } else if (isHotPlayer) {
                statusEl.textContent = 'Describe the phrase - don\'t say the words!';
                statusEl.classList.remove('listening');
            }
        }

        // Connect to WebSocket
        function connect(roomId) {
            // Close existing connection if any
            if (ws) {
                isReconnecting = true;
                ws.close();
            }

            // Stop existing heartbeat
            stopHeartbeat();

            currentRoomId = roomId;
            updateUrl(roomId);
            roomInput.value = roomId;

            // Get or create player ID
            myPlayerId = getOrCreatePlayerId();

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/game/${roomId}`);

            ws.onopen = () => {
                isReconnecting = false;

                // Send player name to server
                const playerName = playerNameInput.value.trim() || onlineNameInput.value.trim() || 'Anonymous';
                ws.send(JSON.stringify({
                    type: 'SET_NAME',
                    player: playerName,
                    playerId: myPlayerId
                }));

                // Start heartbeat
                startHeartbeat();

                statusEl.textContent = 'Connected! Waiting for players...';
                listenBtn.disabled = false;
                skipBtn.disabled = false;
                gotItBtn.disabled = false;
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);

                if (msg.type === 'PLAYER_LIST') {
                    // Update player list
                    onlinePlayers = msg.players || [];
                    onlineHotPlayerIndex = msg.hotPlayerIndex || 0;
                    updatePlayerListUI();

                    // Refresh word display based on new role
                    if (currentWord) {
                        showNewWordOnline(currentWord, onlineRevealedWords);
                    }
                } else if (msg.type === 'WORD_PROGRESS') {
                    // Update revealed words (for guessers)
                    onlineRevealedWords = msg.revealed || [];
                    if (!isHotPlayer) {
                        renderWordProgress();
                    }
                } else if (msg.type === 'NEW_WORD') {
                    const word = msg.word;
                    const revealed = msg.revealed || new Array(word.split(' ').length).fill(false);

                    // If celebrating, queue the word for later
                    if (isCelebrating) {
                        pendingWord = { word, revealed };
                    } else {
                        if (isLocalMode) {
                            showNewWord(word);
                        } else {
                            onlineRevealedWords = revealed;
                            showNewWordOnline(word, revealed);
                        }
                    }
                } else if (msg.type === 'ROUND_WON') {
                    // Update local score if game is active
                    incrementLocalScore();
                    statusEl.textContent = `${msg.player} won the round!`;
                    statusEl.classList.remove('listening', 'skipped');
                    statusEl.classList.add('winner');
                    // Clear redaction timer during celebration
                    if (redactTimer) clearTimeout(redactTimer);
                    showCelebration(msg.player, currentWord);
                } else if (msg.type === 'WORD_SKIPPED') {
                    const skipper = msg.player || 'Someone';
                    statusEl.textContent = `${skipper} skipped! New phrase...`;
                    statusEl.classList.remove('listening', 'winner');
                    statusEl.classList.add('skipped');
                } else if (msg.type === 'TIMER_SYNC') {
                    // Sync timer for players joining mid-game
                    if (msg.timeRemaining !== undefined && msg.timeRemaining > 0) {
                        timeRemaining = msg.timeRemaining;
                        timerCountEl.textContent = timeRemaining;
                        if (!gameActive) {
                            gameActive = true;
                            timerDisplayEl.classList.add('active');
                            // Start the local countdown
                            if (gameTimer) clearInterval(gameTimer);
                            gameTimer = setInterval(() => {
                                timeRemaining--;
                                timerCountEl.textContent = timeRemaining;
                                if (timeRemaining <= 8 && timeRemaining > 0) {
                                    document.body.classList.add('countdown-danger');
                                    timerDisplayEl.classList.add('danger');
                                } else if (timeRemaining <= 15) {
                                    timerDisplayEl.classList.add('warning');
                                }
                                if (timeRemaining <= 0) {
                                    endGame();
                                }
                            }, 1000);
                        }
                    }
                } else if (msg.type === 'GAME_STARTED') {
                    // Game started by another player
                    if (!gameActive) {
                        startGameTimer();
                    }
                } else if (msg.type === 'NEW_ROUND') {
                    // New round started - reset and start fresh
                    dismissLeaderboard();
                    localScore = 0;
                    scoreCountEl.textContent = '0';
                    hasClaimedVictory = false;

                    // Hide play again, show normal buttons
                    playAgainBtn.style.display = 'none';
                    updateOnlineModeButtons();

                    // Start fresh game timer
                    startGameTimer();

                    // Restart mic if it was previously active
                    if (isListening) {
                        if (!recognition) initSpeechRecognition();
                        try { recognition.start(); } catch(e) {}
                    }

                    // The NEW_WORD message will follow with the new phrase
                } else if (msg.type === 'SCORE_UPDATE') {
                    // Only update if game not active (initial load)
                    if (!gameActive && msg.score !== undefined) {
                        scoreCountEl.textContent = msg.score;
                    }
                } else if (msg.type === 'DESCRIBER_SLIPPED') {
                    // Describer said a forbidden word - show penalty
                    const word = msg.word || '???';
                    statusEl.textContent = `Oops! Describer said "${word}"!`;
                    statusEl.classList.remove('listening', 'winner');
                    statusEl.classList.add('skipped');
                    // Flash the word display briefly to show the penalty
                    wordContainer.classList.add('slip-penalty');
                    setTimeout(() => wordContainer.classList.remove('slip-penalty'), 500);
                } else if (msg.type === 'DESCRIBER_FAILED') {
                    // Describer said the whole phrase - big fail!
                    const describerName = msg.player || 'Describer';
                    statusEl.textContent = `${describerName} said the phrase! Skipping...`;
                    statusEl.classList.remove('listening', 'winner');
                    statusEl.classList.add('skipped');
                    // Show a fail animation
                    wordContainer.classList.add('describer-fail');
                    setTimeout(() => wordContainer.classList.remove('describer-fail'), 1000);
                }
            };

            ws.onclose = () => {
                listenBtn.disabled = true;
                skipBtn.disabled = true;
                gotItBtn.disabled = true;
                stopHeartbeat();
                if (!isReconnecting) {
                    statusEl.textContent = 'Disconnected. Reconnecting...';
                    setTimeout(() => connect(currentRoomId), 2000);
                }
            };

            ws.onerror = () => {
                statusEl.textContent = 'Connection error';
            };
        }

        // Join a new room
        function joinRoom() {
            const newRoom = roomInput.value.trim();
            if (newRoom && newRoom !== currentRoomId) {
                // End any active game
                if (gameActive) {
                    endGame();
                }
                wordDisplay.textContent = 'Joining...';
                wordContainer.classList.remove('redacted');
                scoreCountEl.textContent = '0';
                currentWords = [];
                revealedWords = [];
                renderWordProgress();
                if (redactTimer) clearTimeout(redactTimer);
                connect(newRoom);
            }
        }

        // Initialize Speech Recognition
        function initSpeechRecognition() {
            if (!SpeechRecognition) return;

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                transcriptEl.textContent = transcript || '-';

                // In local mode, check for individual word reveals
                if (isLocalMode && gameActive && !hasClaimedVictory) {
                    updateRevealedWords(transcript);
                    // If all words were revealed, victory was already claimed
                    if (hasClaimedVictory) return;
                }

                // In online mode as guesser, check for individual word reveals
                if (!isLocalMode && !isHotPlayer && gameActive && !hasClaimedVictory) {
                    updateRevealedWordsOnline(transcript);
                    // Check if all words revealed
                    if (onlineRevealedWords.every(r => r)) {
                        return; // Victory will be handled by server
                    }
                }

                // In online mode as hot player, check for forbidden words
                if (!isLocalMode && isHotPlayer && gameActive) {
                    checkDescriberSpeech(transcript);
                }

                // Check for match with similarity (full phrase)
                const result = checkMatch(transcript);

                if (result.similarity > 0 && result.similarity < 1) {
                    const pct = Math.round(result.similarity * 100);
                    similarityEl.textContent = `${pct}% match`;
                    similarityEl.classList.toggle('close', result.similarity >= 0.7);

                    // Show "CLOSE!" anticipation overlay when >80% but not yet matched (online mode only)
                    if (!isLocalMode && !isHotPlayer && result.similarity >= 0.80 && !result.matched && !hasClaimedVictory) {
                        closeMatchPct.textContent = `${pct}%`;
                        closeMatchOverlay.classList.add('active');
                    } else {
                        closeMatchOverlay.classList.remove('active');
                    }
                } else {
                    similarityEl.textContent = '';
                    closeMatchOverlay.classList.remove('active');
                }

                if (result.matched && !hasClaimedVictory) {
                    closeMatchOverlay.classList.remove('active');
                    if (isLocalMode) {
                        localModeClaimVictory();
                    } else if (!isHotPlayer) {
                        // Guesser matched full phrase
                        hasClaimedVictory = true;
                        claimVictory();
                    }
                }
            };

            recognition.onerror = (event) => {
                if (event.error === 'not-allowed') {
                    errorEl.textContent = 'Microphone access denied. Please allow microphone access and refresh.';
                } else if (event.error !== 'aborted') {
                    console.log('Speech recognition error:', event.error);
                }
            };

            recognition.onend = () => {
                // Restart if still supposed to be listening
                if (isListening) {
                    recognition.start();
                }
            };
        }

        // Claim victory
        function claimVictory() {
            if (buttonCooldown) return;
            const playerName = playerNameInput.value.trim() || 'Anonymous';
            if (ws && ws.readyState === WebSocket.OPEN) {

        // ========== LOBBY & NAVIGATION ==========

        // ========== DEVICE ORIENTATION ==========

        let orientationHandler = null;

        function enableOrientationDetection() {
            // Check if this is likely a mobile/tablet device
            const isTouchDevice = ('ontouchstart' in window) ||
                                  (navigator.maxTouchPoints > 0) ||
                                  (navigator.msMaxTouchPoints > 0);

            const isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

            // If not a touch/mobile device, skip orientation and use tap-to-reveal directly
            if (!isTouchDevice && !isMobileUA) {
                console.log('Desktop detected - using tap-to-reveal');
                enableTapToReveal();
                return;
            }

            // Check if DeviceOrientationEvent is available
            if (!window.DeviceOrientationEvent) {
                console.log('DeviceOrientation not supported');
                enableTapToReveal();
                return;
            }

            // iOS 13+ requires permission
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            startOrientationListening();
                        } else {
                            console.log('Orientation permission denied');
                            enableTapToReveal();
                        }
                    })
                    .catch(err => {
                        console.log('Orientation permission error:', err);
                        enableTapToReveal();
                    });
            } else {
                // Non-iOS or older iOS
                startOrientationListening();
            }
        }

        let orientationDataReceived = false;
        let orientationCheckTimeout = null;

        function startOrientationListening() {
            orientationEnabled = true;
            orientationDataReceived = false;

            orientationHandler = (event) => {
                const beta = event.beta;  // -180 to 180 (front-to-back tilt)
                const gamma = event.gamma; // -90 to 90 (left-to-right tilt)

                // Check if we're getting real data (not null/0)
                if (beta !== null && beta !== 0) {
                    orientationDataReceived = true;
                }

                // Device is "flat" when beta is close to 0 and gamma is close to 0
                // beta ~= 0 means screen facing up
                // beta ~= 90 means screen facing user (upright)
                // Adding some hysteresis to prevent flicker

                const flatThreshold = 35;
                const uprightThreshold = 45;

                if (beta !== null) {
                    const absBeta = Math.abs(beta);

                    if (absBeta < flatThreshold && Math.abs(gamma) < flatThreshold) {
                        if (!deviceIsFlat) {
                            deviceIsFlat = true;
                            updateWordVisibilityByOrientation();
                        }
                    } else if (absBeta > uprightThreshold || Math.abs(gamma) > uprightThreshold) {
                        if (deviceIsFlat) {
                            deviceIsFlat = false;
                            updateWordVisibilityByOrientation();
                        }
                    }
                }
            };

            window.addEventListener('deviceorientation', orientationHandler);

            // Check after 1 second if we received orientation data
            // If not, fall back to tap-to-reveal mode
            orientationCheckTimeout = setTimeout(() => {
                if (!orientationDataReceived) {
                    console.log('No orientation data - falling back to tap-to-reveal');
                    enableTapToReveal();
                }
            }, 1000);

            updateWordVisibilityByOrientation();
        }

        // Press-to-reveal for all devices
        let tapToRevealEnabled = false;

        function enableTapToReveal() {
            orientationEnabled = false;
            tapToRevealEnabled = true;
            deviceIsFlat = false;

            wordContainer.classList.add('orientation-hidden');
            wordContainer.style.cursor = 'pointer';

            // Press and hold to reveal - mouse events
            wordContainer.addEventListener('mousedown', startReveal);
            wordContainer.addEventListener('mouseup', stopReveal);
            wordContainer.addEventListener('mouseleave', stopReveal);

            // Touch events for mobile
            wordContainer.addEventListener('touchstart', startReveal, { passive: true });
            wordContainer.addEventListener('touchend', stopReveal, { passive: true });
            wordContainer.addEventListener('touchcancel', stopReveal, { passive: true });
        }

        function startReveal(e) {
            if (!isLocalMode || !gameActive) return;
            deviceIsFlat = true;
            wordContainer.classList.remove('orientation-hidden');
        }

        function stopReveal(e) {
            if (!isLocalMode || !gameActive) return;
            deviceIsFlat = false;
            wordContainer.classList.add('orientation-hidden');
        }

        function updateWordVisibilityByOrientation() {
            if (!orientationEnabled && !tapToRevealEnabled) return;

            if (deviceIsFlat) {
                wordContainer.classList.remove('orientation-hidden');
                wordContainer.classList.remove('redacted');
            } else {
                wordContainer.classList.add('orientation-hidden');
                wordContainer.classList.remove('redacted');
            }

            updateButtonsForMode();
        }

        function disableOrientationDetection() {
            orientationEnabled = false;
            deviceIsFlat = false;
            tapToRevealEnabled = false;
            if (orientationHandler) {
                window.removeEventListener('deviceorientation', orientationHandler);
                orientationHandler = null;
            }
            if (orientationCheckTimeout) {
                clearTimeout(orientationCheckTimeout);
                orientationCheckTimeout = null;
            }
            // Remove press-to-reveal listeners
            wordContainer.removeEventListener('mousedown', startReveal);
            wordContainer.removeEventListener('mouseup', stopReveal);
            wordContainer.removeEventListener('mouseleave', stopReveal);
            wordContainer.removeEventListener('touchstart', startReveal);
            wordContainer.removeEventListener('touchend', stopReveal);
            wordContainer.removeEventListener('touchcancel', stopReveal);
            wordContainer.style.cursor = '';
            wordContainer.classList.remove('orientation-hidden');
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Escape: return to lobby (or reset lobby selection)
            if (e.code === 'Escape') {
                e.preventDefault();
                if (gameScreen.classList.contains('active')) {
                    showLobby();
                } else {
                    // In lobby - reset selection
                    selectedMode = null;
                    localSection.classList.remove('selected');
                    onlineSection.classList.remove('selected');
                    localModeBtn.textContent = '📱 Play on this device';
                    onlineModeBtn.textContent = '🌐 Join a room';
                }
                return;
            }

            // Local mode only shortcuts
            if (!isLocalMode || !gameActive) return;

            // Space: reveal word (press and hold)
            if (e.code === 'Space' && !e.repeat) {
                e.preventDefault();
                startReveal();
            }

            // Enter: Got it!
            if (e.code === 'Enter') {
                e.preventDefault();
                if (!hasClaimedVictory) {
                    localModeClaimVictory();
                }
            }

            // Tab: Skip phrase
            if (e.code === 'Tab') {
                e.preventDefault();
                localModeSkipWord();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (!isLocalMode || !gameActive) return;

            // Space released: hide word
            if (e.code === 'Space') {
                e.preventDefault();
                stopReveal();
            }
        });

        // Restore saved data on page load
        restorePlayersUI();

        // Restore online name
        const savedOnlineName = localStorage.getItem('hotwords_online_name');
        if (savedOnlineName) {
            onlineNameInput.value = savedOnlineName;
        }

        // Deep link support: ?room=RoomName&name=PlayerName
        function handleDeepLink() {
            const params = new URLSearchParams(window.location.search);
            const roomParam = params.get('room');
            const nameParam = params.get('name');

            if (roomParam) {
                // Fill in room name
                roomInput.value = roomParam;

                // Fill in player name if provided
                if (nameParam) {
                    onlineNameInput.value = nameParam;
                    playerNameInput.value = nameParam;
                }

                // Auto-select online mode and start
                selectedMode = 'online';
                onlineSection.classList.add('selected');
                localSection.classList.remove('selected');
                onlineModeBtn.textContent = '▶ Start';

                // Small delay to let UI update, then auto-start
                setTimeout(() => {
                    startOnlineGame();
                }, 100);
            }
        }

        // Check for deep link on page load
        handleDeepLink();
    </script>
</body>
</html>
