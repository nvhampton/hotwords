<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotwords</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
        }
        .word-progress {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 15px;
            font-family: monospace;
            letter-spacing: 2px;
            min-height: 40px;
        }
        .word-progress .word-hidden {
            color: #666;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            margin: 0 3px;
            display: inline-block;
        }
        .word-progress .word-revealed {
            color: #4ecdc4;
            text-shadow: 0 0 10px rgba(78, 205, 196, 0.8);
            margin: 0 3px;
            display: inline-block;
            animation: wordReveal 0.3s ease-out;
        }
        @keyframes wordReveal {
            0% { transform: scale(1.3); color: #f9ca24; }
            100% { transform: scale(1); color: #4ecdc4; }
        }
        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .room-info {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
        }
        .room-info label {
            font-size: 0.9rem;
            color: #888;
            display: block;
            margin-bottom: 8px;
        }
        .room-input-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .room-input {
            font-size: 1.2rem;
            padding: 8px 16px;
            border: 2px solid rgba(138, 43, 226, 0.5);
            border-radius: 20px;
            background: rgba(138, 43, 226, 0.2);
            color: #fff;
            text-align: center;
            width: 160px;
            font-weight: bold;
        }
        .room-input:focus {
            outline: none;
            border-color: #8a2be2;
            background: rgba(138, 43, 226, 0.3);
        }
        .join-btn {
            font-size: 1rem;
            padding: 8px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            background: linear-gradient(135deg, #8a2be2 0%, #6a1cb2 100%);
            color: #fff;
            transition: all 0.3s ease;
        }
        .join-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(138, 43, 226, 0.4);
        }
        .join-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .word-display {
            font-size: 3rem;
            font-weight: bold;
            margin: 40px 0;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            text-shadow: 0 0 30px rgba(78, 205, 196, 0.8);
            color: #4ecdc4;
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.3s ease;
        }
        .word-display.redacted {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            text-shadow: none;
        }
        .word-display.redacted .word-text {
            opacity: 0;
        }
        .word-display .word-text {
            transition: opacity 0.3s ease;
        }
        .word-display .redact-label {
            position: absolute;
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .word-display.redacted .redact-label {
            opacity: 1;
        }
        .score-display {
            text-align: center;
            margin: 20px 0;
        }
        .score-number {
            font-size: 4rem;
            font-weight: bold;
            color: #f9ca24;
            text-shadow: 0 0 30px rgba(249, 202, 36, 0.6);
            line-height: 1;
        }
        .score-label {
            font-size: 1rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .timer-display {
            font-size: 2rem;
            font-weight: bold;
            color: #4ecdc4;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        .timer-display.active {
            opacity: 1;
        }
        .timer-display.warning {
            color: #f9ca24;
        }
        .timer-display.danger {
            color: #ff6b6b;
            animation: pulse 0.5s ease-in-out infinite;
        }
        .status {
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 20px;
            min-height: 30px;
        }
        .status.listening {
            color: #4ecdc4;
        }
        .status.winner {
            color: #ff6b6b;
            font-weight: bold;
            animation: pulse 0.5s ease-in-out 3;
        }
        .status.skipped {
            color: #f9ca24;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        button {
            font-size: 1.2rem;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .gotit-btn {
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
            color: #fff;
            font-size: 1.3rem;
            padding: 18px 50px;
        }
        .gotit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(78, 205, 196, 0.4);
        }
        .skip-btn {
            background: linear-gradient(135deg, #f9ca24 0%, #f0932b 100%);
            color: #1a1a2e;
            font-weight: bold;
        }
        .skip-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(249, 202, 36, 0.4);
        }
        .button-row {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .listen-row {
            margin-top: 15px;
        }
        .listen-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #888;
            font-size: 0.9rem;
            padding: 8px 20px;
        }
        .listen-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }
        .listen-btn.active {
            background: rgba(255, 107, 107, 0.2);
            border-color: rgba(255, 107, 107, 0.4);
            color: #ff6b6b;
        }
        .transcript {
            margin-top: 30px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            font-size: 0.9rem;
            color: #888;
            min-height: 50px;
        }
        .transcript span {
            color: #4ecdc4;
        }
        .audio-disclaimer {
            display: none;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 8px;
            font-style: italic;
        }
        .transcript.listening .audio-disclaimer {
            display: block;
        }
        .similarity {
            font-size: 0.8rem;
            color: #666;
            margin-top: 5px;
        }
        .similarity.close {
            color: #f9ca24;
        }
        .player-input {
            margin-bottom: 20px;
        }
        .player-input input {
            font-size: 1rem;
            padding: 10px 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            text-align: center;
            width: 200px;
        }
        .player-input input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        .player-input input:focus {
            outline: none;
            border-color: #4ecdc4;
        }
        .error {
            color: #ff6b6b;
            margin-top: 20px;
        }

        /* Celebration overlay */
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            overflow: hidden;
            opacity: 0;
            background: rgba(26, 26, 46, 0.95);
            transition: opacity 0.3s ease;
        }
        .celebration.active {
            opacity: 1;
        }
        .celebration-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1001;
            width: 90%;
        }
        .celebration-text {
            font-size: 15vw;
            font-weight: bold;
            color: #4ecdc4;
            text-shadow: 0 0 40px rgba(78, 205, 196, 1), 0 0 80px rgba(78, 205, 196, 0.8), 0 0 120px rgba(78, 205, 196, 0.6);
            animation: celebratePulse 0.4s ease-in-out infinite alternate;
            line-height: 1.1;
            text-transform: uppercase;
        }
        .celebration-winner {
            font-size: 1.5rem;
            color: #ff6b6b;
            margin-top: 30px;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.8);
        }
        @keyframes celebratePulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* Explosion particles */
        .particle {
            position: absolute;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            animation: explode 2s ease-out forwards;
        }
        @keyframes explode {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(1);
                opacity: 0;
            }
        }

        /* Confetti */
        .confetti {
            position: absolute;
            width: 10px;
            height: 20px;
            animation: confettiFall 2s ease-out forwards;
        }
        @keyframes confettiFall {
            0% {
                transform: translateY(-100%) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Screen flash */
        .celebration-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(255,107,107,0.6) 0%, transparent 70%);
            animation: flash 0.5s ease-out forwards;
        }
        @keyframes flash {
            0% { opacity: 1; transform: scale(0.5); }
            100% { opacity: 0; transform: scale(2); }
        }

        /* Player Setup */
        .player-setup {
            margin-top: 12px;
            padding: 0;
        }
        .player-setup h3 {
            margin: 0 0 15px 0;
            color: #8a2be2;
            font-size: 1rem;
        }
        .player-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }
        .player-entry {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .player-entry input {
            flex: 1;
            font-size: 0.9rem;
            padding: 8px 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        .player-entry input:focus {
            outline: none;
            border-color: #8a2be2;
        }
        .player-entry .remove-player {
            width: 30px;
            height: 30px;
            padding: 0;
            border-radius: 50%;
            font-size: 1.2rem;
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            border: none;
            cursor: pointer;
        }
        .player-entry .remove-player:hover {
            background: rgba(255, 107, 107, 0.4);
        }
        .add-player-btn {
            font-size: 0.9rem;
            padding: 8px 16px;
            border: 2px dashed rgba(138, 43, 226, 0.5);
            border-radius: 20px;
            background: transparent;
            color: #8a2be2;
            cursor: pointer;
            width: 100%;
        }
        .add-player-btn:hover {
            background: rgba(138, 43, 226, 0.1);
        }
        .start-pass-game-btn {
            margin-top: 10px;
            font-size: 1rem;
            padding: 10px 20px;
            background: linear-gradient(135deg, #8a2be2 0%, #6a1cb2 100%);
            color: #fff;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
        }
        .start-pass-game-btn:hover {
            box-shadow: 0 5px 20px rgba(138, 43, 226, 0.4);
        }
        .start-pass-game-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Lobby Screen */
        .lobby {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .lobby h1 {
            font-size: 3rem;
            margin-bottom: 30px;
            color: #ff6b6b;
        }
        .lobby-room {
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
        }
        .lobby-room label {
            font-size: 1rem;
            color: #888;
            display: block;
            margin-bottom: 12px;
        }
        .mode-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }
        .mode-section {
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        .mode-section.local-section {
            background: rgba(138, 43, 226, 0.1);
            border: 2px solid rgba(138, 43, 226, 0.3);
            border-radius: 25px;
            padding: 15px;
        }
        .mode-btn {
            font-size: 1.3rem;
            padding: 20px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        .mode-btn.local {
            background: linear-gradient(135deg, #8a2be2 0%, #6a1cb2 100%);
            color: #fff;
        }
        .mode-btn.online {
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
            color: #fff;
        }
        .mode-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 1rem;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            color: #fff;
            cursor: pointer;
            z-index: 100;
            display: none;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .back-btn.active {
            display: block;
        }
        .game-screen {
            display: none;
        }
        .game-screen.active {
            display: block;
        }
        .lobby.hidden {
            display: none;
        }

        /* Current Player Indicator */
        .current-player-indicator {
            display: none;
            margin-bottom: 15px;
            padding: 10px 20px;
            background: rgba(78, 205, 196, 0.2);
            border: 2px solid rgba(78, 205, 196, 0.4);
            border-radius: 25px;
            color: #4ecdc4;
            font-weight: bold;
        }
        .current-player-indicator.active {
            display: inline-block;
        }

        /* Orientation Indicator */
        .orientation-indicator {
            display: none;
            margin-bottom: 15px;
            padding: 10px 20px;
            background: rgba(249, 202, 36, 0.2);
            border: 2px solid rgba(249, 202, 36, 0.4);
            border-radius: 25px;
            color: #f9ca24;
            font-size: 0.9rem;
        }
        .orientation-indicator.active {
            display: block;
        }
        .orientation-indicator.flat {
            background: rgba(78, 205, 196, 0.2);
            border-color: rgba(78, 205, 196, 0.4);
            color: #4ecdc4;
        }

        /* Word hidden by orientation/press */
        .word-display.orientation-hidden {
            background: linear-gradient(135deg, #2d2d44 0%, #1a1a2e 100%);
            cursor: pointer;
        }
        .word-display.orientation-hidden .word-text {
            opacity: 0;
        }
        .word-display.orientation-hidden .redact-label {
            opacity: 1;
        }
        .word-display.orientation-hidden:active {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Hide online-only elements in local mode */
        .local-mode .player-input {
            display: none;
        }
        .local-mode .transcript {
            display: none;
        }
        .local-mode .orientation-indicator {
            display: none !important;
        }

        /* Close Match Anticipation Overlay */
        .close-match-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(249, 202, 36, 0.15);
            z-index: 500;
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .close-match-overlay.active {
            display: flex;
            animation: closeMatchPulse 0.3s ease-in-out infinite alternate;
        }
        .close-match-text {
            font-size: 20vw;
            font-weight: bold;
            color: #f9ca24;
            text-shadow: 0 0 40px rgba(249, 202, 36, 0.8), 0 0 80px rgba(249, 202, 36, 0.5);
            animation: closeMatchBounce 0.2s ease-in-out infinite alternate;
        }
        .close-match-pct {
            position: absolute;
            bottom: 20%;
            font-size: 3rem;
            color: #f9ca24;
            text-shadow: 0 0 20px rgba(249, 202, 36, 0.8);
        }
        @keyframes closeMatchPulse {
            0% { background: rgba(249, 202, 36, 0.1); }
            100% { background: rgba(249, 202, 36, 0.25); }
        }
        @keyframes closeMatchBounce {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* Version number */
        .version {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.2);
        }

        /* Make orientation indicator clickable */
        .orientation-indicator {
            cursor: pointer;
        }
        .orientation-indicator:hover {
            background: rgba(249, 202, 36, 0.3);
        }
    </style>
</head>
<body>
    <!-- Back Button -->
    <button class="back-btn" id="backBtn">← Back</button>

    <!-- Lobby Screen -->
    <div class="lobby" id="lobbyScreen">
        <h1>🔥 Hotwords</h1>

        <div class="lobby-room">
            <label>Room Name</label>
            <div class="room-input-row">
                <input type="text" class="room-input" id="roomInput" maxlength="20" spellcheck="false">
                <button class="join-btn" id="randomBtn">Random</button>
            </div>
        </div>

        <div class="mode-buttons">
            <!-- Local Mode Section -->
            <div class="mode-section local-section">
                <button class="mode-btn local" id="startLocalBtn">🎯 Local Mode</button>
                <div class="player-setup" id="playerSetup">
                    <div class="player-list" id="playerList">
                        <div class="player-entry">
                            <input type="text" placeholder="Player 1" maxlength="20">
                            <button class="remove-player" onclick="removePlayer(this)">&times;</button>
                        </div>
                        <div class="player-entry">
                            <input type="text" placeholder="Player 2" maxlength="20">
                            <button class="remove-player" onclick="removePlayer(this)">&times;</button>
                        </div>
                    </div>
                    <button class="add-player-btn" id="addPlayerBtn">+ Add Player</button>
                </div>
            </div>

            <!-- Online Mode Section -->
            <button class="mode-btn online" id="startOnlineBtn">🌐 Online Mode</button>
        </div>

        <div class="version">v1.6.0</div>
    </div>

    <!-- Game Screen -->
    <div class="container game-screen" id="gameScreen">
        <div class="word-progress" id="wordProgress"></div>

        <div class="player-input">
            <input type="text" id="playerName" placeholder="Enter your name" maxlength="20">
        </div>

        <!-- Current Player Indicator (Local Mode) -->
        <div class="current-player-indicator" id="currentPlayerIndicator"></div>

        <!-- Orientation Indicator (Local Mode) -->
        <div class="orientation-indicator" id="orientationIndicator">
            Hold device flat to see word
        </div>

        <div class="word-display" id="wordContainer">
            <span class="word-text" id="currentWord">Connecting...</span>
            <span class="redact-label" id="redactLabel">MEMORIZE THE PHRASE!</span>
        </div>

        <div class="score-display" id="scoreDisplay">
            <div class="score-number" id="scoreCount">0</div>
            <div class="score-label">points</div>
        </div>

        <div class="timer-display" id="timerDisplay">
            <span id="timerCount">60</span>s
        </div>

        <div class="status" id="status">Click the button to start listening</div>

        <div class="button-row">
            <button class="gotit-btn" id="gotItBtn" disabled>Got It!</button>
            <button class="skip-btn" id="skipBtn" disabled>Skip</button>
        </div>
        <div class="listen-row">
            <button class="listen-btn" id="listenBtn" disabled>🎤 Start Listening</button>
        </div>

        <div class="transcript" id="transcriptBox">
            Heard: <span id="transcript">-</span>
            <div class="similarity" id="similarity"></div>
            <div class="audio-disclaimer">All audio processing is performed locally and nothing is saved.</div>
        </div>

        <div class="error" id="error"></div>
    </div>

    <!-- Close Match Anticipation Overlay -->
    <div class="close-match-overlay" id="closeMatchOverlay">
        <div class="close-match-text">CLOSE!</div>
        <div class="close-match-pct" id="closeMatchPct">85%</div>
    </div>

    <!-- Celebration overlay -->
    <div class="celebration" id="celebration">
        <div class="celebration-content">
            <div class="celebration-text" id="celebrationWord"></div>
            <div class="celebration-winner" id="winnerName"></div>
        </div>
    </div>

    <script>
        // Screen elements
        const lobbyScreen = document.getElementById('lobbyScreen');
        const gameScreen = document.getElementById('gameScreen');
        const backBtn = document.getElementById('backBtn');
        const startLocalBtn = document.getElementById('startLocalBtn');
        const startOnlineBtn = document.getElementById('startOnlineBtn');

        // Game elements
        const wordDisplay = document.getElementById('currentWord');
        const wordContainer = document.getElementById('wordContainer');
        const statusEl = document.getElementById('status');
        const listenBtn = document.getElementById('listenBtn');
        const skipBtn = document.getElementById('skipBtn');
        const gotItBtn = document.getElementById('gotItBtn');
        const transcriptEl = document.getElementById('transcript');
        const similarityEl = document.getElementById('similarity');
        const playerNameInput = document.getElementById('playerName');

        // Levenshtein distance for similarity checking
        function levenshteinDistance(str1, str2) {
            const m = str1.length;
            const n = str2.length;
            const dp = Array(m + 1).fill(null).map(() => Array(n + 1).fill(0));

            for (let i = 0; i <= m; i++) dp[i][0] = i;
            for (let j = 0; j <= n; j++) dp[0][j] = j;

            for (let i = 1; i <= m; i++) {
                for (let j = 1; j <= n; j++) {
                    if (str1[i - 1] === str2[j - 1]) {
                        dp[i][j] = dp[i - 1][j - 1];
                    } else {
                        dp[i][j] = 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
                    }
                }
            }
            return dp[m][n];
        }

        // Calculate similarity percentage
        function similarity(str1, str2) {
            const s1 = str1.toLowerCase().trim();
            const s2 = str2.toLowerCase().trim();
            if (s1 === s2) return 1;
            const maxLen = Math.max(s1.length, s2.length);
            if (maxLen === 0) return 1;
            const distance = levenshteinDistance(s1, s2);
            return (maxLen - distance) / maxLen;
        }

        // Check if transcript matches current phrase (with fuzzy matching)
        function checkMatch(transcript) {
            if (!currentWord || hasClaimedVictory) return { matched: false, similarity: 0 };

            const targetLower = currentWord.toLowerCase().trim();
            const heardLower = transcript.toLowerCase().trim();

            // Exact match
            if (heardLower.includes(targetLower)) {
                return { matched: true, similarity: 1 };
            }

            // Check similarity of the full phrase against windows in transcript
            const targetWords = targetLower.split(/\s+/);
            const heardWords = heardLower.split(/\s+/);

            let bestSimilarity = 0;

            // Sliding window over heard words
            for (let i = 0; i <= heardWords.length - targetWords.length; i++) {
                const windowPhrase = heardWords.slice(i, i + targetWords.length).join(' ');
                const sim = similarity(windowPhrase, targetLower);
                bestSimilarity = Math.max(bestSimilarity, sim);
            }

            // Also check full transcript similarity
            const fullSim = similarity(heardLower, targetLower);
            bestSimilarity = Math.max(bestSimilarity, fullSim);

            // Check each word individually and average (for partial matches)
            if (targetWords.length > 1) {
                for (let i = 0; i <= heardWords.length - targetWords.length; i++) {
                    let wordMatchSum = 0;
                    for (let j = 0; j < targetWords.length; j++) {
                        const wordSim = similarity(heardWords[i + j] || '', targetWords[j]);
                        wordMatchSum += wordSim;
                    }
                    const avgSim = wordMatchSum / targetWords.length;
                    bestSimilarity = Math.max(bestSimilarity, avgSim);
                }
            }

            // 85% similarity threshold for fuzzy match
            const SIMILARITY_THRESHOLD = 0.85;
            return {
                matched: bestSimilarity >= SIMILARITY_THRESHOLD,
                similarity: bestSimilarity
            };
        }

        // Connect to WebSocket
        function connect(roomId) {
            // Close existing connection if any
            if (ws) {
                isReconnecting = true;
                ws.close();
            }

            currentRoomId = roomId;
            updateUrl(roomId);
            roomInput.value = roomId;

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/game/${roomId}`);

            ws.onopen = () => {
                isReconnecting = false;
                statusEl.textContent = 'Connected! Click to start listening.';
                listenBtn.disabled = false;
                skipBtn.disabled = false;
                gotItBtn.disabled = false;
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);

                if (msg.type === 'NEW_WORD') {
                    // If celebrating, queue the word for later
                    if (isCelebrating) {
                        pendingWord = msg.word;
                    } else {
                        showNewWord(msg.word);
                    }
                } else if (msg.type === 'ROUND_WON') {
                    // Update local score if game is active
                    incrementLocalScore();
                    statusEl.textContent = `${msg.player} won the round!`;
                    statusEl.classList.remove('listening', 'skipped');
                    statusEl.classList.add('winner');
                    // Clear redaction timer during celebration
                    if (redactTimer) clearTimeout(redactTimer);

                } else if (msg.type === 'WORD_SKIPPED') {
                    const skipper = msg.player || 'Someone';
                    statusEl.textContent = `${skipper} skipped the word`;
                    statusEl.classList.remove('listening', 'winner');
                    statusEl.classList.add('skipped');
                } else if (msg.type === 'SCORE_UPDATE') {
                    // Only update if game not active (initial load)
                    if (!gameActive && msg.score !== undefined) {
                        scoreCountEl.textContent = msg.score;
                    }
                }
            };

            ws.onclose = () => {
                listenBtn.disabled = true;
                skipBtn.disabled = true;
                gotItBtn.disabled = true;
                if (!isReconnecting) {
                    statusEl.textContent = 'Disconnected. Reconnecting...';
                    setTimeout(() => connect(currentRoomId), 2000);
                }
            };

            ws.onerror = () => {
                statusEl.textContent = 'Connection error';
            };
        }

        // Initialize Speech Recognition
        function initSpeechRecognition() {
            if (!SpeechRecognition) return;

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                transcriptEl.textContent = transcript || '-';

                // In local mode, check for individual word reveals
                if (isLocalMode && gameActive && !hasClaimedVictory) {
                    updateRevealedWords(transcript);
                    // If all words were revealed, victory was already claimed
                    if (hasClaimedVictory) return;
                }

                // Check for match with similarity (full phrase)
                const result = checkMatch(transcript);

                if (result.similarity > 0 && result.similarity < 1) {
                    const pct = Math.round(result.similarity * 100);
                    similarityEl.textContent = `${pct}% match`;
                    similarityEl.classList.toggle('close', result.similarity >= 0.7);

                    // Show "CLOSE!" anticipation overlay when >80% but not yet matched (online mode only)
                    if (!isLocalMode && result.similarity >= 0.80 && !result.matched && !hasClaimedVictory) {
                        closeMatchPct.textContent = `${pct}%`;
                        closeMatchOverlay.classList.add('active');
                    } else {
                        closeMatchOverlay.classList.remove('active');
                    }
                } else {
                    similarityEl.textContent = '';
                    closeMatchOverlay.classList.remove('active');
                }

                if (result.matched && !hasClaimedVictory) {
                    closeMatchOverlay.classList.remove('active');
                    if (isLocalMode) {
                        localModeClaimVictory();
                    } else {
                        hasClaimedVictory = true;
                        claimVictory();
                    }
                }
            };

            recognition.onerror = (event) => {
                if (event.error === 'not-allowed') {
                    errorEl.textContent = 'Microphone access denied. Please allow microphone access and refresh.';
                } else if (event.error !== 'aborted') {
                    console.log('Speech recognition error:', event.error);
                }
            };

            recognition.onend = () => {
                // Restart if still supposed to be listening
                if (isListening) {
                    recognition.start();
                }
            };
        }

        function claimVictory() {

            } else {
                isListening = true;
                recognition.start();
                listenBtn.textContent = 'Stop Listening';
                listenBtn.classList.add('active');
                statusEl.textContent = 'Listening... Say the phrase!';
                statusEl.classList.add('listening');
                transcriptBox.classList.add('listening');
                // Start the game timer (online mode only)
                if (!isLocalMode && !gameActive) {
                    startGameTimer();
                }
            }
        });

        // Skip button
        skipBtn.addEventListener('click', skipWord);

        // Got It button - manual claim victory
        gotItBtn.addEventListener('click', () => {
            if (isLocalMode && gameActive) {
                localModeClaimVictory();
            } else if (!isLocalMode && gameActive) {
                if (!hasClaimedVictory) {
                    hasClaimedVictory = true;
                    claimVictory();
                }
            }
        });

        // Random room button
        randomBtn.addEventListener('click', () => {
            let newRoom = getRandomRoomName();
            // Make sure we get a different room
            while (newRoom === currentRoomId) {
                newRoom = getRandomRoomName();
            }
            roomInput.value = newRoom;
            joinRoom();
        });

        // Auto-join on blur (when done editing)
        roomInput.addEventListener('blur', joinRoom);

        // Enter key on room input
        roomInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                roomInput.blur(); // This triggers blur which calls joinRoom
            }
        });

        // Initialize room input with random name
        const initialRoom = getInitialRoom();
        roomInput.value = initialRoom;
        currentRoomId = initialRoom;

        // ========== LOBBY & NAVIGATION ==========

        // Show game screen, hide lobby
        function showGameScreen() {
            lobbyScreen.classList.add('hidden');
            gameScreen.classList.add('active');
            backBtn.classList.add('active');
        }

        // Show lobby, hide game screen
        function showLobby() {
            // Stop any active game
            if (gameActive) {
                endGame();
            }
            // Disconnect WebSocket
            if (ws) {
                isReconnecting = true;
                ws.close();
                ws = null;
            }
            // Stop listening
            if (isListening && recognition) {
                isListening = false;
                recognition.stop();
            }
            // Reset state
            isLocalMode = false;
            currentWords = [];
            revealedWords = [];
            renderWordProgress();
            gameScreen.classList.remove('active', 'local-mode');
            lobbyScreen.classList.remove('hidden');
            backBtn.classList.remove('active');
            currentPlayerIndicator.classList.remove('active');
            orientationIndicator.classList.remove('active');
            wordContainer.classList.remove('orientation-hidden');
            disableOrientationDetection();
        }

        // Back button
        backBtn.addEventListener('click', showLobby);

        // Start Local Mode
        startLocalBtn.addEventListener('click', () => {
            // Get players from setup
            const inputs = playerList.querySelectorAll('input');
            localModePlayers = Array.from(inputs)
                .map((i, idx) => i.value.trim() || `Player ${idx + 1}`)
                .filter(name => name);

            if (localModePlayers.length < 2) {
                alert('Please add at least 2 players');
                return;
            }

            // Save players
            savePlayersToStorage(localModePlayers);

            // Set up local mode
            isLocalMode = true;
            currentPlayerIndex = 0;
            localScore = 0;
            currentRoomId = roomInput.value.trim() || getRandomRoomName();

            // Show game screen
            showGameScreen();
            gameScreen.classList.add('local-mode');

            // Initialize UI
            currentPlayerIndicator.classList.add('active');
            currentPlayerIndicator.textContent = `${localModePlayers[0]}'s turn`;
            scoreCountEl.textContent = '0';
            wordDisplay.textContent = 'Get Ready!';

            // Enable orientation/tap detection
            enableOrientationDetection();

            // Start the timer
            startGameTimer();

            // Start listening automatically
            if (!recognition) {
                initSpeechRecognition();
            }
            isListening = true;
            recognition.start();
            listenBtn.textContent = 'Stop Listening';
            listenBtn.classList.add('active');
            listenBtn.disabled = false;
            skipBtn.disabled = false;
            gotItBtn.disabled = false;
            statusEl.textContent = 'Listening... Say the phrase!';
            statusEl.classList.add('listening');
            transcriptBox.classList.add('listening');

            // Pick the first word
            const word = localGameWords[Math.floor(Math.random() * localGameWords.length)];
            showNewWordLocalMode(word);
        });

        // Start Online Mode
        startOnlineBtn.addEventListener('click', () => {
            isLocalMode = false;
            currentRoomId = roomInput.value.trim() || getRandomRoomName();

            // Show game screen
            showGameScreen();

            // Connect to WebSocket
            connect(currentRoomId);
        });

        // Add player
        addPlayerBtn.addEventListener('click', () => {
            const playerCount = playerList.children.length + 1;
            const entry = document.createElement('div');
            entry.className = 'player-entry';
            entry.innerHTML = `
                <input type="text" placeholder="Player ${playerCount}" maxlength="20">
                <button class="remove-player" onclick="removePlayer(this)">&times;</button>
            `;
            playerList.appendChild(entry);
        });

        // Remove player
        function removePlayer(btn) {
            if (playerList.children.length > 2) {
                btn.parentElement.remove();
            }
        }
        window.removePlayer = removePlayer; // Make globally accessible

        // LocalStorage functions for remembering players
        function savePlayersToStorage(players) {
            try {
                localStorage.setItem('hotwords_players', JSON.stringify(players));
            } catch (e) {
                console.log('Could not save players to localStorage');
            }
        }

        function loadPlayersFromStorage() {
            try {
                const saved = localStorage.getItem('hotwords_players');
                if (saved) {
                    return JSON.parse(saved);
                }
            } catch (e) {
                console.log('Could not load players from localStorage');
            }
            return null;
        }

        function restorePlayersUI() {
            const savedPlayers = loadPlayersFromStorage();
            if (savedPlayers && savedPlayers.length >= 2) {
                playerList.innerHTML = '';
                savedPlayers.forEach((name, idx) => {
                    const entry = document.createElement('div');
                    entry.className = 'player-entry';
                    entry.innerHTML = `
                        <input type="text" placeholder="Player ${idx + 1}" maxlength="20" value="${name}">
                        <button class="remove-player" onclick="removePlayer(this)">&times;</button>
                    `;
                    playerList.appendChild(entry);
                });
            }
        }


        // Show new word in local mode (hidden until revealed)
        function showNewWordLocalMode(word) {
            currentWord = word;
            hasClaimedVictory = false;
            wordDisplay.textContent = currentWord;

            // Initialize word-by-word tracking
            currentWords = word.trim().split(/\s+/);
            revealedWords = new Array(currentWords.length).fill(false);
            renderWordProgress();

            // Reset to hidden state for new word
            if (orientationEnabled || tapToRevealEnabled) {
                deviceIsFlat = false;
                updateWordVisibilityByOrientation();
            } else {
                wordContainer.classList.remove('redacted', 'orientation-hidden');
                if (redactTimer) clearTimeout(redactTimer);
                redactTimer = setTimeout(() => {
                    wordContainer.classList.add('redacted');
                }, REDACT_DELAY);
            }

            // Update label for local mode
            redactLabelEl.textContent = 'PRESS & HOLD TO REVEAL';

            statusEl.textContent = 'Listening... Say the phrase!';
            statusEl.classList.remove('winner', 'skipped');
            statusEl.classList.add('listening');
        }

        // Local Mode: Claim victory
        function localModeClaimVictory() {
            if (!isLocalMode || !gameActive || hasClaimedVictory) return;
            hasClaimedVictory = true;

            const player = localModePlayers[currentPlayerIndex];
            localScore++;
            scoreCountEl.textContent = localScore;

            closeMatchOverlay.classList.remove('active');

            // Show celebration
            showCelebration(player, currentWord);

            // After celebration, move to next player
            setTimeout(() => {
                nextLocalModePlayer();
            }, CELEBRATION_DELAY + 500);
        }

        // Local Mode: Skip word
        function localModeSkipWord() {
            if (!isLocalMode || !gameActive) return;

            const player = localModePlayers[currentPlayerIndex];
            statusEl.textContent = `${player} skipped`;
            statusEl.classList.add('skipped');

            closeMatchOverlay.classList.remove('active');

            // Move to next player
            nextLocalModePlayer();
        }

        // Move to next player in local mode
        function nextLocalModePlayer() {
            currentPlayerIndex = (currentPlayerIndex + 1) % localModePlayers.length;

            // Keep listening active - just reset transcript
            transcriptEl.textContent = '-';
            similarityEl.textContent = '';
            similarityEl.classList.remove('close');

            // Update player indicator
            currentPlayerIndicator.textContent = `${localModePlayers[currentPlayerIndex]}'s turn`;

            // Pick a new word
            const word = localGameWords[Math.floor(Math.random() * localGameWords.length)];
            showNewWordLocalMode(word);
        }

        // Override skip button for local mode
        skipBtn.addEventListener('click', (e) => {
            if (isLocalMode && gameActive) {
                e.stopPropagation();
                localModeSkipWord();
            }
        }, true);

        // Update button text
        function updateButtonsForMode() {
            listenBtn.textContent = isListening ? 'Stop Listening' : 'Start Listening';
            listenBtn.classList.toggle('active', isListening);
            skipBtn.textContent = isLocalMode ? 'Skip' : 'Skip Word';
        }

        // ========== DEVICE ORIENTATION ==========

        let orientationHandler = null;

        function enableOrientationDetection() {
            // Check if this is likely a mobile/tablet device
            const isTouchDevice = ('ontouchstart' in window) ||
                                  (navigator.maxTouchPoints > 0) ||
                                  (navigator.msMaxTouchPoints > 0);

            const isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

            // If not a touch/mobile device, skip orientation and use tap-to-reveal directly
            if (!isTouchDevice && !isMobileUA) {
                console.log('Desktop detected - using tap-to-reveal');
                enableTapToReveal();
                return;
            }

            // Check if DeviceOrientationEvent is available
            if (!window.DeviceOrientationEvent) {
                console.log('DeviceOrientation not supported');
                enableTapToReveal();
                return;
            }

            // iOS 13+ requires permission
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            startOrientationListening();
                        } else {
                            console.log('Orientation permission denied');
                            enableTapToReveal();
                        }
                    })
                    .catch(err => {
                        console.log('Orientation permission error:', err);
                        enableTapToReveal();
                    });
            } else {
                // Non-iOS or older iOS
                startOrientationListening();
            }
        }

        let orientationDataReceived = false;
        let orientationCheckTimeout = null;

        function startOrientationListening() {
            orientationEnabled = true;
            // Hide indicator for cleaner UI - orientation just works
            orientationIndicator.classList.remove('active');
            orientationDataReceived = false;

            orientationHandler = (event) => {
                const beta = event.beta;  // -180 to 180 (front-to-back tilt)
                const gamma = event.gamma; // -90 to 90 (left-to-right tilt)

                // Check if we're getting real data (not null/0)
                if (beta !== null && beta !== 0) {
                    orientationDataReceived = true;
                }

                // Device is "flat" when beta is close to 0 and gamma is close to 0
                // beta ~= 0 means screen facing up
                // beta ~= 90 means screen facing user (upright)
                // Adding some hysteresis to prevent flicker

                const flatThreshold = 35;
                const uprightThreshold = 45;

                if (beta !== null) {
                    const absBeta = Math.abs(beta);

                    if (absBeta < flatThreshold && Math.abs(gamma) < flatThreshold) {
                        if (!deviceIsFlat) {
                            deviceIsFlat = true;
                            updateWordVisibilityByOrientation();
                        }
                    } else if (absBeta > uprightThreshold || Math.abs(gamma) > uprightThreshold) {
                        if (deviceIsFlat) {
                            deviceIsFlat = false;
                            updateWordVisibilityByOrientation();
                        }
                    }
                }
            };

            window.addEventListener('deviceorientation', orientationHandler);

            // Check after 1 second if we received orientation data
            // If not, fall back to tap-to-reveal mode
            orientationCheckTimeout = setTimeout(() => {
                if (!orientationDataReceived) {
                    console.log('No orientation data - falling back to tap-to-reveal');
                    enableTapToReveal();
                }
            }, 1000);

            updateWordVisibilityByOrientation();
        }

        // Press-to-reveal for all devices
        let tapToRevealEnabled = false;

        function enableTapToReveal() {
            orientationEnabled = false;
            tapToRevealEnabled = true;
            deviceIsFlat = false;

            // Hide orientation indicator for cleaner UI
            orientationIndicator.classList.remove('active');
            wordContainer.classList.add('orientation-hidden');
            wordContainer.style.cursor = 'pointer';

            // Press and hold to reveal - mouse events
            wordContainer.addEventListener('mousedown', startReveal);
            wordContainer.addEventListener('mouseup', stopReveal);
            wordContainer.addEventListener('mouseleave', stopReveal);

            // Touch events for mobile
            wordContainer.addEventListener('touchstart', startReveal, { passive: true });
            wordContainer.addEventListener('touchend', stopReveal, { passive: true });
            wordContainer.addEventListener('touchcancel', stopReveal, { passive: true });
        }

        function startReveal(e) {
            if (!isLocalMode || !gameActive) return;
            deviceIsFlat = true;
            wordContainer.classList.remove('orientation-hidden');
        }

        function stopReveal(e) {
            if (!isLocalMode || !gameActive) return;
            deviceIsFlat = false;
            wordContainer.classList.add('orientation-hidden');
        }

        function updateWordVisibilityByOrientation() {
            if (!orientationEnabled && !tapToRevealEnabled) return;

            if (deviceIsFlat) {
                wordContainer.classList.remove('orientation-hidden');
                wordContainer.classList.remove('redacted');
            } else {
                wordContainer.classList.add('orientation-hidden');
                wordContainer.classList.remove('redacted');
            }

            updateButtonsForMode();
        }

        function disableOrientationDetection() {
            orientationEnabled = false;
            deviceIsFlat = false;
            tapToRevealEnabled = false;
            if (orientationHandler) {
                window.removeEventListener('deviceorientation', orientationHandler);
                orientationHandler = null;
            }
            if (orientationCheckTimeout) {
                clearTimeout(orientationCheckTimeout);
                orientationCheckTimeout = null;
            }
            // Remove press-to-reveal listeners
            wordContainer.removeEventListener('mousedown', startReveal);
            wordContainer.removeEventListener('mouseup', stopReveal);
            wordContainer.removeEventListener('mouseleave', stopReveal);
            wordContainer.removeEventListener('touchstart', startReveal);
            wordContainer.removeEventListener('touchend', stopReveal);
            wordContainer.removeEventListener('touchcancel', stopReveal);
            wordContainer.style.cursor = '';
            wordContainer.classList.remove('orientation-hidden');
            orientationIndicator.classList.remove('active', 'flat');
        }

        // Restore saved players on page load
        restorePlayersUI();
    </script>
</body>
</html>
